<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대관 규정 및 상품 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/prep.css?v=20261126zv">
<link rel="stylesheet" href="css/rent.css?v=20261126zv">
<link rel="stylesheet" href="css/menu.css?v=20261126zv">
</head>
<body>
<!-- 예약보조 › 고객 응대 보조 · 대관 규정 및 상품 (2026-11-24): 대관 상품마다 산출 기준 · 금액 · 추가 · 장소 · 조건을 표로. 팀이 함께 고치고 더함 — js/rent.js -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">대관 규정 및 상품</span>
  <span class="me" id="me"></span>
</header>
<main class="rent-main">
  <section class="panel">
    <h2>대관 규정 및 상품 <small id="sum"></small>
      <span class="right"><span class="save-st" id="st"></span><button class="btn" id="editMode" type="button" title="순서 바꾸기 · 빼기 버튼 보이기">순서 · 빼기</button><button class="btn primary" id="addBtn" type="button">＋ 항목 추가</button></span></h2>
    <p class="hint">줄을 누르면 고칠 수 있습니다 · 팀이 함께 봅니다 · 고친 사람과 시각이 남습니다</p>
    <div class="rent-tools"><input id="q" type="search" placeholder="항목 · 장소 · 조건으로 찾기" data-ime="ko" autocomplete="off"></div>
    <div class="tw"><table class="rent-t"><thead id="head"></thead><tbody id="body"></tbody></table></div>
    <p class="hint rent-log" id="log"></p>
  </section>
</main>

<!-- 옆 보기 (노션 사이드 보기처럼 · 2026-11-24): 「자세히 보기」 · 줄 누르기 → 오른쪽에서 열림 -->
<aside class="peek" id="peek" hidden aria-label="자세히 보기"><div class="peek-in" id="peekBody"></div></aside>

<!-- 고치기 · 더하기 -->
<div class="pmodal" id="editModal" hidden>
  <section class="panel rent-edit" role="dialog" aria-modal="true" aria-labelledby="eTitle">
    <h2 id="eTitle">항목 고치기</h2>
    <div id="eFields"></div>
    <p class="err" id="eErr"></p>
    <div class="dm-btns"><button class="btn primary" id="eDel" type="button">이 항목 빼기</button><span class="sp"></span><button class="btn" id="eNo" type="button">취소</button><button class="btn primary" id="eOk" type="button">저장</button></div>
  </section>
</div>
<!-- 빼기 확인 -->
<div class="pmodal" id="askModal" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">확인</h2>
    <p id="askMsg"></p>
    <div class="dm-btns"><button class="btn" id="askNo" type="button">취소</button><button class="btn primary" id="askYes" type="button">확인</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="js/common.js?v=20261126zv"></script>
<script src="js/rent.js?v=20261126zv"></script>
<script src="js/menu.js?v=20261126zv"></script>
</body>
</html>
