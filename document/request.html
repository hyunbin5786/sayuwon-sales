<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사유원 견적 요청</title>
<meta name="robots" content="noindex">
<!-- 고객 견적 요청 (2026-11-21): 고객님이 로그인 없이 휴대폰 · PC에서 직접 입력 → 공유 기록(quotereq 시트)에 한 건 저장.
     직원은 견적서 화면(document/) 1단계 「고객 견적 요청」 목록에서 열어 초안으로 채우고 검수 · 출력 · 메일 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="css/document.css?v=20261121r">
</head><body class="reqpage">
<header class="reqhd"><span class="reqbrand">사유원</span><span class="reqcrumb">단체 견적 요청</span></header>
<main class="reqwrap">
  <form id="req-form" class="panel reqpanel" novalidate>
    <div class="body">
      <p class="reqlead">아래 내용을 남겨 주시면 확인 후 적어 주신 이메일로 견적서를 보내 드립니다.</p>
      <div class="field">
        <label for="q-org">단체명 <b class="req">*</b></label>
        <input id="q-org" type="text" maxlength="60" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="q-name">담당자 성함 <b class="req">*</b></label>
        <input id="q-name" type="text" maxlength="30" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="q-phone">연락처 <b class="req">*</b></label>
        <input id="q-phone" type="tel" maxlength="14" inputmode="tel" autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="q-email">이메일 <b class="req">*</b></label>
        <input id="q-email" type="email" maxlength="100" inputmode="email" autocomplete="email" required>
        <span class="hint">견적서를 이 주소로 보내 드립니다</span>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="q-date">방문 희망일 <b class="req">*</b></label>
          <input id="q-date" type="date" data-ph="누르면 달력" required>
        </div>
        <div class="field">
          <label for="q-pax">인원</label>
          <input id="q-pax" type="number" min="1" max="99999" step="1" inputmode="numeric">
        </div>
      </div>
      <div class="field">
        <label for="q-memo">요청사항</label>
        <textarea id="q-memo" rows="5" maxlength="1000"></textarea>
        <span class="hint">관람 시간 · 식사 · 프로그램 등 원하시는 내용을 자유롭게 적어 주세요</span>
      </div>
      <div class="hpfield" aria-hidden="true"><label for="q-hp">비워 두세요</label><input id="q-hp" type="text" tabindex="-1" autocomplete="off"></div>
      <label class="agree"><input id="q-agree" type="checkbox"> <span><b>개인정보 수집 · 이용에 동의합니다</b> <b class="req">*</b><br>
        <small>수집 항목: 단체명 · 담당자 성함 · 연락처 · 이메일 / 목적: 견적서 발송 및 예약 상담 / 보관: 1년 후 파기</small></span></label>
      <div id="q-err" class="warn" role="alert"></div>
      <button class="btn primary block" type="submit" id="q-send">견적 요청 보내기</button>
    </div>
  </form>
  <section class="panel reqpanel" id="req-done" hidden>
    <div class="body">
      <h2 class="reqdone-t">요청이 접수되었습니다</h2>
      <p class="reqlead" id="req-done-text"></p>
      <button class="btn block" type="button" id="q-again">다른 요청 보내기</button>
    </div>
  </section>
</main>
<script src="../js/common.js?v=20261121c"></script>
<script src="js/request.js?v=20261121a"></script>
<script src="js/datebox.js?v=20261118r"></script>
</body></html>
