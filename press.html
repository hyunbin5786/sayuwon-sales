<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍보 기자 리스트 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/prep.css?v=20261126zk">
<link rel="stylesheet" href="css/press.css?v=20261126zk">
<link rel="stylesheet" href="css/menu.css?v=20261126zk">
</head>
<body>
<!-- 홍보 보조 › 홍보 기자 리스트 (2026-11-24): 기자 연락처를 표에서 바로 고치고 · 더하고 · 지우고, 메일 보낼 때 쓰는 「주소, 주소, …」 모양으로 복사 — js/press.js
     연락처는 서버 DB(press 표)에만 · 이 저장소(GitHub)에는 넣지 않음 -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">홍보 기자 리스트</span>
  <span class="me" id="me"></span>
</header>
<main class="press-main">
  <section class="panel">
    <h2>홍보 기자 리스트 <small id="sum"></small>
      <span class="right"><span class="save-st" id="st"></span><button class="btn primary" id="addBtn" type="button">＋ 기자 추가</button><label class="btn">엑셀 · 독스 불러오기<input type="file" id="impFile" accept=".xlsx,.xls,.docx" multiple hidden></label><button class="btn" id="xlOut" type="button">엑셀로 내려받기</button></span></h2>
    <div class="pr-lists" id="lists"></div>
    <div class="pr-bar">
      <select id="cat"><option value="">구분 전체</option></select>
      <input id="q" type="search" placeholder="매체 · 이름 · 이메일 · 메모로 찾기" data-ime="ko" autocomplete="off">
      <label class="hint"><input type="checkbox" id="dupOnly"> 같은 리스트 안 이메일 겹침만</label>
      <span class="sp"></span>
      <button class="btn primary" id="copyMail" type="button" title="체크한 기자(없으면 지금 보이는 기자 모두)의 이메일을 「주소, 주소, …」로 복사 — 메일 받는 사람 · 숨은참조 칸에 바로 붙여 넣기">메일 주소 복사</button>
      <button class="btn" id="copyDoc" type="button" title="독스에 붙이는 모양: 첫 줄 리스트 이름 · 다음 줄 주소, 주소, …">독스 모양으로 복사</button>
      <button class="btn" id="delSel" type="button" disabled>선택 삭제</button>
    </div>
    <p class="hint">칸을 눌러 바로 고치고 Enter(또는 다른 칸)를 누르면 저장 · 왼쪽 체크로 여러 명 고르기 · 같은 리스트에 같은 이메일이 두 번 있으면 주황 · 메일 주소 복사는 겹치는 주소를 한 번만</p>
    <div class="tw pr-tw"><table class="pr-t"><thead id="head"></thead><tbody id="body"></tbody></table></div>
    <p class="hint" id="more"></p>
  </section>
</main>

<!-- 불러오기 미리 보기 -->
<div class="pmodal" id="impModal" hidden>
  <section class="panel pr-imp" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <h2 id="impTitle">불러오기</h2>
    <div id="impBody"></div>
    <p class="err" id="impErr"></p>
    <div class="dm-btns"><button class="btn" id="impNo" type="button">취소</button><button class="btn primary" id="impOk" type="button">넣기</button></div>
  </section>
</div>
<!-- 확인 -->
<div class="pmodal" id="askModal" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">확인</h2>
    <p id="askMsg"></p>
    <div class="dm-btns"><button class="btn" id="askNo" type="button">취소</button><button class="btn primary" id="askYes" type="button">확인</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/common.js?v=20261126zk"></script>
<script src="js/press.js?v=20261126zk"></script>
<script src="js/menu.js?v=20261126zk"></script>
</body>
</html>
