<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전화응대 멘트 · 사유원 운영 보조 시스템</title>
<!-- 로그인하지 않아도 볼 수 있음 (복사만). 추가 · 수정은 로그인한 사람만 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/ops.css?v=20261123k">
<link rel="stylesheet" href="css/ment.css?v=20261123k">
<link rel="stylesheet" href="css/menu.css?v=20261123k">
</head>
<body>
<!-- 고객 응대 보조 · 전화응대 멘트 (2026-11-18): 자주 쓰는 안내 멘트를 모아 두고 눌러서 복사. 공유 기록(calls)의 한 줄 id=mentdb 에 저장 -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">전화응대 멘트</span>
  <span class="me" id="me"></span>
  <button type="button" class="ko-toggle on" id="ko-toggle" aria-pressed="true">한</button>
</header>
<main>
  <div id="keyBox" class="panel keybox" hidden>
    <p>고친 내용을 저장하려면 로그인이 필요합니다. <a href="./">첫 화면</a>에서 다시 로그인해 주세요 (팀 비밀번호는 없앰 · 2026-11-21).</p>
    <p class="err" id="keyErr"></p>
  </div>
  <section class="panel">
    <div class="b-head"><h2>전화응대 멘트</h2><span class="hint" id="sum"></span><span class="sync" id="sync"></span>
      <span class="b-tools"><input id="q" type="search" placeholder="검색" data-ime="ko" autocomplete="off"><button type="button" class="btn primary" id="addBtn">＋ 멘트 추가</button></span></div>
    <p class="hint" id="guestHint" hidden>로그인하지 않아도 보고 복사할 수 있습니다. 추가 · 수정은 로그인한 사람만 할 수 있습니다.</p>
    <div class="ment-list" id="list"></div>
  </section>
</main>
<div class="modal" id="askModal" hidden>
  <section class="panel ask-box" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">삭제 확인</h2><p id="askMsg"></p>
    <div class="row-btns"><span class="sp"></span><button type="button" class="btn" id="askNo">취소</button><button type="button" class="btn primary" id="askYes">삭제</button></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/common.js?v=20261123k"></script>
<script src="js/ment.js?v=20261123k"></script>
<script src="js/ime.js?v=20261123k"></script>
<script src="js/keepsize.js?v=20261123k"></script>
<script src="js/menu.js?v=20261123k"></script>
</body>
</html>
