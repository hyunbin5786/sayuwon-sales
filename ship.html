<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트스토어 발송 보고 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/ops.css?v=20261126m">
<link rel="stylesheet" href="css/mypop.css?v=20261126m">
<link rel="stylesheet" href="css/menu.css?v=20261126m">
</head>
<body>
<!-- 스마트스토어 발송 보고 (2026-11-21 운영보조에서 따로 나눈 페이지 · 칸은 js/ship.js · 동작은 js/opsboard.js) -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb" id="crumb"></span>
  <span class="me" id="me"></span>
  <button type="button" class="hd-btn" data-mypop title="내 개인고객 통화 · 단체 예약의 추후 과업을 한눈에 (팝업)">나의 할일</button>
  <button type="button" class="ko-toggle on" id="ko-toggle" aria-pressed="true">한</button>
</header>
<main>
  <div id="keyBox" class="panel keybox" hidden>
    <p>로그인 정보를 확인할 수 없습니다. <a href="./">첫 화면</a>에서 다시 로그인해 주세요 (팀 비밀번호는 없앰 · 2026-11-21).</p>
    <p class="err" id="keyErr"></p>
  </div>
  <section class="panel" id="board">
    <div class="b-head"><h2 id="bTitle"></h2><span class="hint" id="bSum"></span><span class="sync" id="sync"></span>
      <span class="b-tools"><input id="q" type="search" placeholder="검색" data-ime="ko" autocomplete="off"><button type="button" class="btn primary" id="addBtn">＋ 추가</button></span></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
</main>

<!-- 추가 · 고치기 -->
<div class="modal" id="editModal" hidden>
  <section class="panel edit-box" role="dialog" aria-modal="true" aria-labelledby="eTitle">
    <h2 id="eTitle"></h2>
    <form id="eForm" autocomplete="off"><div class="egrid" id="eFields"></div>
      <p class="err" id="eErr"></p>
      <div class="row-btns"><button type="button" class="btn" id="eDel" hidden>삭제</button><span class="sp"></span><button type="button" class="btn" id="eCancel">취소</button><button type="submit" class="btn primary" id="eSave">저장</button></div>
    </form>
  </section>
</div>
<!-- 삭제 확인 -->
<div class="modal" id="askModal" hidden>
  <section class="panel ask-box" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">삭제 확인</h2><p id="askMsg"></p>
    <div class="row-btns"><span class="sp"></span><button type="button" class="btn" id="askNo">취소</button><button type="button" class="btn primary" id="askYes">삭제</button></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/common.js?v=20261126m"></script>
<script src="js/opslib.js?v=20261126m"></script>
<script src="js/ship.js?v=20261126m"></script>
<script src="js/opsboard.js?v=20261126m"></script>
<div class="mypop" id="myPop" hidden><div class="box"><iframe id="myPopFrame" title="나의 할일"></iframe></div></div>
<script src="js/mypop.js?v=20261126m"></script>
<script src="js/ime.js?v=20261126m"></script>
<script src="js/keepsize.js?v=20261126m"></script>
<script src="js/menu.js?v=20261126m"></script>
<script src="js/timepick.js?v=20261126m"></script>
</body>
</html>
