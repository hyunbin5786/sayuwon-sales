<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 현황 공유 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem("sy_user")||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/prep.css?v=20261125h">
<link rel="stylesheet" href="css/status.css?v=20261125h">
<link rel="stylesheet" href="css/menu.css?v=20261125h">
</head>
<body>
<!-- 고객 응대 보조 · 예약 현황 공유 (2026-11-18): 방문자내역 엑셀(하루에 한 파일, 여러 날 함께 가능) → 날짜마다 「구분 · 인원 · 세부 · 단체 예약 포함」 표 → 직접 고친 뒤 사진(PNG)으로 저장해 공지 -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">예약 현황 공유</span>
  <span class="me" id="me"></span>
</header>
<main class="st-main">
  <div class="st-cols"><!-- 1열: 넣는 칸 + 고치는 표 · 2열: 미리보기 (2026-11-19) -->
  <div class="st-left">
  <section class="panel">
    <!-- 2026-11-19 간단하게: 엑셀(방문자내역 · 네이버) 한 칸, 아래 한 줄에 비밀번호 · 네이버 사진은 없앰 (네이버 엑셀이 안 되면 직접 입력 팝업) -->
    <div class="in-grid">
      <label class="drop" id="drop" title="전산 방문자내역(.xls · 날짜마다 한 파일)과 네이버 예약자관리(.xlsx)를 함께 넣어도 됩니다. 이 브라우저 안에서만 읽고, 같은 날짜를 다시 넣으면 그 날짜만 새로"><input type="file" id="file" accept=".xls,.xlsx,.html,.htm" multiple hidden>
        <b>엑셀 넣기</b><span class="hint">오늘 · 내일 방문자내역 · 네이버 예약자관리 — 끌어다 놓거나 눌러서 고르기</span></label>
    </div>
    <div class="in-opts">
      <label title="네이버 인원은 네이버 이관 2단계와 같은 방식 (전액환불은 빼고, 일부 환불은 환불금액만큼 인원을 뺌)">네이버 엑셀 비밀번호 <input type="password" id="nvPw" autocomplete="off"></label><label class="chk"><input type="checkbox" id="nvKeep" checked> 기억</label>
      <span class="share-st" id="shareSt" style="margin-left:auto" title="이 화면 내용은 팀이 함께 봅니다 (하루 동안 유지 · 날이 바뀌면 지난 날짜는 지움)"></span><button class="btn" id="stClear" type="button" hidden>모두 지우기</button>   <!-- 네이버 엑셀 비밀번호와 같은 줄 (2026-11-19) -->
    </div>
    <div id="nvImgBox" class="nv-imgbox" hidden></div>
    <p class="err" id="fileErr"></p>
  </section>
  <div id="stEdit"></div>
  </div>
  <!-- 오른쪽 열: 미리보기 (사진과 같음) + 위에 「사진으로 저장」 (2026-11-19 · 제목은 「사유원 예약 현황」 고정) -->
  <aside class="st-right" id="stRight" hidden>
    <div class="pv-top"><span class="pv-h">미리보기 (사진과 같음)</span><button class="btn primary" id="stPng" type="button">사진으로 저장</button></div>
    <div class="pv-box"><div id="stPrev" class="st-shot-view"></div></div>
  </aside>
  </div>
</main>
<!-- 네이버 엑셀을 못 읽으면 직접 입력 (2026-11-19) -->
<div class="pmodal" id="nvManModal" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="nvManTitle" style="max-width:520px">
    <h2 id="nvManTitle">네이버 인원을 직접 넣어 주세요</h2>
    <p id="nvManMsg" class="hint"></p>
    <table class="ed-t nvman-t"><thead><tr><th>날짜</th><th>오전입장</th><th>오후입장</th><th></th></tr></thead><tbody id="nvManBody"></tbody></table>
    <div class="dm-btns"><button class="btn sm" id="nvManAdd" type="button" hidden>＋ 날짜 추가</button><!-- 오늘 · 내일만 (2026-11-21) --><span class="sp"></span><button class="btn" id="nvManNo" type="button">취소</button><button class="btn primary" id="nvManOk" type="button">넣기</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<div id="stShot" class="st-shot" aria-hidden="true"></div><!-- 사진으로 저장할 때만 그리는 표 (화면 밖) -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/common.js?v=20261125h"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/naverxl.js?v=20261125h"></script>
<script src="js/naverimg.js?v=20261125h"></script>
<script src="js/dailyguard.js?v=20261125h"></script>
<script src="js/status.js?v=20261125h"></script>
<script>syDaily.guard('status', '예약 현황 공유');   /* 오늘 다른 사람이 이미 했으면 경고 (2026-11-24) */</script>
<script src="js/ime.js?v=20261125h"></script>
<script src="js/menu.js?v=20261125h"></script>
</body>
</html>
