<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 현황 공유 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem("sy_user")||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/prep.css?v=20261119c7">
<link rel="stylesheet" href="css/status.css?v=20261119c8">
<link rel="stylesheet" href="css/menu.css?v=20261119c1">
</head>
<body>
<!-- 고객 응대 보조 · 예약 현황 공유 (2026-11-18): 방문자내역 엑셀(하루에 한 파일, 여러 날 함께 가능) → 날짜마다 「구분 · 인원 · 세부 · 단체 예약 포함」 표 → 직접 고친 뒤 사진(PNG)으로 저장해 공지 -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">예약 현황 공유</span>
  <span class="me" id="me"></span>
</header>
<main class="st-main">
  <section class="panel">
    <!-- 2026-11-19 간단하게: 왼쪽 엑셀(방문자내역 · 네이버) · 오른쪽 네이버 사진, 아래 한 줄에 비밀번호 -->
    <div class="in-grid">
      <label class="drop" id="drop" title="전산 방문자내역(.xls · 날짜마다 한 파일)과 네이버 예약자관리(.xlsx)를 함께 넣어도 됩니다. 이 브라우저 안에서만 읽고, 같은 날짜를 다시 넣으면 그 날짜만 새로"><input type="file" id="file" accept=".xls,.xlsx,.html,.htm" multiple hidden>
        <b>엑셀 넣기</b><span class="hint">방문자내역 · 네이버 예약자관리 — 끌어다 놓거나 눌러서 고르기</span></label>
      <button class="drop drop-img" id="nvImgBtn" type="button" title="네이버 엑셀이 안 될 때: 네이버 예약 달력 화면 캡처의 파란 「확정」 숫자를 읽어 확인 표로 보여 줌"><b>네이버 사진</b><span class="hint">캡처 후 Ctrl+V · 눌러서 고르기</span></button><input type="file" id="nvImgFile" accept="image/*" hidden>
    </div>
    <div class="in-opts">
      <label title="네이버 인원은 네이버 이관 2단계와 같은 방식 (전액환불은 빼고, 일부 환불은 환불금액만큼 인원을 뺌)">네이버 엑셀 비밀번호 <input type="password" id="nvPw" autocomplete="off"></label><label class="chk"><input type="checkbox" id="nvKeep" checked> 기억</label>
      <span class="keybox" id="keyBox" hidden title="단체 예약 이름을 가져오려면 팀 비밀번호가 필요합니다 (다른 화면과 같은 비밀번호)"><span class="hint">단체 이름</span><input id="keyIn" type="password" placeholder="팀 비밀번호" autocomplete="off"><button class="btn primary" id="keyBtn">연결</button></span>
    </div>
    <div id="nvImgBox" class="nv-imgbox" hidden></div>
    <p class="err" id="fileErr"></p>
    <div class="st-bar" id="stBar" hidden>
      <label>제목 <input id="stTitle" data-ime="ko"></label>
      <span class="sp"></span>
      <button class="btn" id="stClear" type="button">모두 지우기</button>
      <button class="btn primary" id="stPng" type="button">사진으로 저장</button>
    </div>
  </section>
  <p class="hint st-help" id="stHelp" hidden>표의 숫자 · 글자는 눌러서 바로 고칠 수 있고, 이 브라우저에 기억됩니다.</p>
  <div id="stEdit"></div>
</main>
<div class="toast" id="toast"></div>
<div id="stShot" class="st-shot" aria-hidden="true"></div><!-- 사진으로 저장할 때만 그리는 표 (화면 밖) -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/common.js?v=20261118"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/naverxl.js?v=20261119b2"></script>
<script src="js/naverimg.js?v=20261119c6"></script>
<script src="js/status.js?v=20261119c8"></script>
<script src="js/ime.js?v=20261118r"></script>
<script src="js/menu.js?v=20261119c1"></script>
</body>
</html>
