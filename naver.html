<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 예약 → 전산 이관 · 사유원 운영 보조 시스템</title>
<script>/* 사유원 운영 보조 시스템 › 고객응대보조 › 네이버 이관: 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<!-- 링크 공유 시 미리보기 제목 (카카오톡 등) -->
<meta property="og:title" content="네이버 예약 → 사유원 전산 이관">
<meta property="og:type" content="website">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/naver.css?v=20261128zi">
<link rel="stylesheet" href="css/menu.css?v=20261128zi">
</head>
<body>
<!-- 사유원 운영 보조 시스템 공통 헤더: 「사유원 운영 보조 시스템」(누르면 메뉴) › 지금 화면 · 👤 로그인한 이름 -->
<header class="sys-hd"><a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">네이버 예약 → 전산 이관</span><span class="sys-me" id="sysMe"></span></header>
<script>try{ var su=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(su && su.name) document.getElementById("sysMe").innerHTML="👤 <b></b>", document.querySelector("#sysMe b").textContent=su.name; }catch(e){}</script>
<div class="topbar">
<div id="today" style="max-width:1100px;margin:10px auto 0;padding:0 16px">
  <div class="card" style="margin:0;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label class="chk"><b>작업 날짜</b> <input type="date" id="workDate"></label>
    <b id="todayText"></b>
    <button class="btn ghost sm" id="todayBack" style="display:none">오늘로</button>
    <span class="tag" id="todayTag"></span>
    <label class="chk" style="margin-left:auto">요금 기준
      <select id="todayDay"><option value="weekday">평일</option><option value="weekend">주말/공휴일</option></select>
    </label>
  </div>
</div>
<nav id="nav">
  <!-- 2026-11-24: 4단계 — 1 텍스트로 명단 → 2 엑셀로 확인(환불 · 최종 인원) → 3 일괄등록 → 4 최종검토 -->
  <button data-s="1" class="on"><span class="n">1</span>텍스트로 하기</button>
  <button data-s="2"><span class="n">2</span>엑셀로 확인하기</button>
  <button data-s="4"><span class="n">3</span>일괄등록</button>
  <button data-s="5"><span class="n">4</span>최종검토</button>
  <button id="btnReset" style="margin-left:auto">↺ 리셋</button>
</nav>
</div>
<main>

<!-- ============ 1단계 ============ -->
<section id="s1" class="on">
  <div class="card">
    <h2>1단계 · 네이버 예약 텍스트로 명단 만들기</h2>
    <textarea id="inAll" placeholder="네이버 예약 텍스트 붙여넣기 (오전권·오후권 섞여 있어도 됩니다)" style="min-height:240px"></textarea>
    <div class="row">
      <button class="btn" id="btnParse">정리하기</button>
      <label class="chk">구분자
        <select id="sep1"><option value=",">쉼표 ( , )</option><option value="\t">탭 (엑셀 칸 자동 분리)</option></select>
      </label>
      <label class="chk"><input type="checkbox" id="hdr1"> 머리글 포함</label>
    </div>
  </div>
  <div class="card" id="res1" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0">정리 결과</h2><span style="display:flex;gap:6px"><button class="btn ghost" id="save1">저장하기</button><button class="btn" id="text2final">2단계(엑셀로 확인)로 →</button></span></div>   <!-- 다음 단계 버튼은 저장하기 오른쪽 (2026-11-20 · 11-24 2단계로) -->
    <div class="stats" id="stat1"></div>
    <div id="warn1"></div>
    <div id="tbl1"></div>
    <div class="row"><button class="btn ghost" data-copy="out1">결과 복사</button></div>
    <textarea class="out" id="out1" readonly style="min-height:200px"></textarea>
  </div>
</section>

<!-- ============ 2단계 ============ -->
<section id="s2">
  <div class="card">
    <h2>2단계 · 네이버 예약자관리 엑셀로 확인 → 최종 인원</h2>
    <div class="row">
      <label class="chk">엑셀 비밀번호 <input type="password" id="pw2" autocomplete="off" style="width:140px"></label>
      <label class="chk"><input type="checkbox" id="pwKeep2" checked> 이 컴퓨터에 기억</label>
    </div>
    <div class="drop" id="drop2"><span id="drop2Label">엑셀 파일을 끌어다 놓거나 클릭해서 선택</span><input type="file" id="file2" accept=".xlsx,.xls,.csv" hidden></div>
    <details style="margin-top:10px"><summary class="hint" style="cursor:pointer">파일 대신 표를 붙여넣기</summary>
      <textarea id="in2" placeholder="엑셀 범위를 복사해서 붙여넣기 (머리글 행 포함)" style="min-height:110px;margin-top:8px"></textarea>
    </details>
    <div class="row" id="prices2" style="display:none">
      <b style="font-size:14px">관람권 가격</b>
      <label class="chk">평일 성인 <input type="number" step="1000" data-price="weekday.adult" style="width:100px"></label>
      <label class="chk">평일 학생 <input type="number" step="1000" data-price="weekday.student" style="width:100px"></label>
      <label class="chk">주말 성인 <input type="number" step="1000" data-price="weekend.adult" style="width:100px"></label>
      <label class="chk">주말 학생 <input type="number" step="1000" data-price="weekend.student" style="width:100px"></label>
      <button class="btn" id="priceSave" disabled>저장</button>
      <button class="btn ghost" id="priceReset">처음 가격으로</button>
    </div>
    <div class="row">
      <button class="btn" id="btnCheck">확인하기</button>
      <button class="btn ghost" id="btnManual">← 1단계(텍스트)로</button>
      <button class="btn ghost" id="btnColmap" style="display:none">엑셀 열 인식 수정하기</button>
      <button class="btn ghost" id="btnPrices">관람권 가격 수정하기</button>
      <button class="btn ghost" id="btnCap">최대 인원 수정</button>
    </div>
    <div class="row" id="cap2" style="display:none">
      <b style="font-size:14px">관람권별 최대 인원</b>
      <label class="chk">오전권 <input type="number" min="1" step="1" data-cap="am" style="width:80px">명</label>
      <label class="chk">오후권 <input type="number" min="1" step="1" data-cap="pm" style="width:80px">명</label>
      <button class="btn" id="capSave">저장</button>
    </div>
    <div class="row" id="colmap2" style="display:none"></div>
    <div id="src2"></div><!-- 명단을 어디서 만들었는지 (엑셀 · 텍스트) · 엑셀로 안 되는 예약 -->
  </div>
  <div class="card" id="res3" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px"><h2 style="margin:0">최종 인원</h2><button class="btn" id="save3">저장하기</button></div>
    <div class="stats" id="stat3"></div>
    <div id="tbl3"></div>
    <div id="unmatched3"></div>
    <div class="row"><button class="btn ghost" data-copy="out3">최종 명단 복사</button></div>
    <textarea class="out" id="out3" readonly></textarea>
  </div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-go="4">3단계(일괄등록)로 가기 →</button></div>
</section>

<!-- ============ 4단계 ============ -->
<section id="s4">
  <div class="card">
    <h2>3단계 · 시스템 일괄등록용 명단</h2>
    <div class="stats" id="stat4"></div>
  </div>
  <div id="groups4"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-go="5">4단계(최종검토)로 가기 →</button></div>
</section>

<!-- ============ 4단계: 최종검토 ============ -->
<section id="s5">
  <div class="card">
    <h2>4단계 · 최종검토</h2>
    <div class="stats" id="stat5"></div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="onlyTodo5"> 미등록만 보기</label>
      <button class="btn" id="checkAll5" style="margin-left:auto">전체 등록</button>
    </div>
    <div id="tbl5"></div>
  </div>
</section>
</main>
<div class="toast" id="toast"></div>

<script src="js/common.js?v=20261128zi"></script>
<script src="js/dailyguard.js?v=20261128zi"></script>
<script src="js/naver.js?v=20261128zi"></script>
<script>syDaily.guard('naver', '네이버 예약 → 사유원 전산 이관');   /* 오늘 다른 사람이 이미 했으면 경고 (2026-11-24) */</script>
<script src="js/menu.js?v=20261128zi"></script>
</body>
</html>
