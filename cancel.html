<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 취소 요청 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/prep.css?v=20261126zo">
<link rel="stylesheet" href="css/cancel.css?v=20261126zo">
<link rel="stylesheet" href="css/menu.css?v=20261126zo">
</head>
<body>
<!-- 고객 응대 보조 · 예약 취소 요청 (2026-11-19): 직원이 취소 담당자에게 예약 취소 처리를 요청 → 담당자가 처리 완료 표시.
     공유 기록(calls) 통화 구분 「취소요청」으로 나눠 저장 (id cxreq0, cxreq1 …) — 요청 내용(고객 이름 · 연락처 · 계좌)은 이 저장소에는 없음 -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb">예약 취소 요청</span>
  <span class="me" id="me"></span>
</header>
<main class="cx-main">
  <section class="panel" id="keyBox" hidden>
    <div class="keybox"><span class="hint">로그인 정보를 확인할 수 없습니다. <a href="./">첫 화면</a>에서 다시 로그인해 주세요 (팀 비밀번호는 없앰 · 2026-11-21).</span></div>
  </section>
  <!-- 2026-11-23: 탭 대신 2열 — 1열 취소 요청하기 · 2열 요청 목록 · 처리 (좁은 화면에서는 위아래) -->
  <div class="cx-top"><span class="save-st" id="st"></span></div>
  <div class="cx-cols">

  <!-- ① 취소 요청하기 (요청 목록의 「정보 채우기」로 열면 그 요청을 고침) -->
  <section class="panel" id="pReq">
    <h2>취소 요청하기</h2>
    <div class="cx-form">
      <p class="cx-edit" id="fEditBar" hidden></p>
      <!-- 전산 예약 붙여넣기 (2026-11-21): 붙여 넣으면 방문일 · 예약자 이름 · 연락처 · 예약 사이트(홈페이지) · 예약 인원 · 상품 · 금액이 저절로 -->
      <div class="cx-erp"><label class="grow">전산 예약 붙여넣기
        <textarea id="fErp" rows="3" placeholder="방문일자(순번) · 상품정보 · 방문자정보 · 예약인원 · 금액 … 전산 예약 내역을 여기에 붙여 넣기"></textarea></label>
        <p class="cx-erp-ok" id="fErpOk" hidden></p></div>
      <div class="cx-row">
        <label>방문일 <input type="date" id="fDate"></label>
        <div class="cx-f"><span class="lb">예약 사이트</span><span class="seg" id="fSite"><button type="button" data-v="홈페이지" class="on">홈페이지</button><button type="button" data-v="네이버">네이버</button><button type="button" data-v="키오스크">키오스크</button><button type="button" data-v="기타">기타</button></span></div>
      </div>
      <div class="cx-row">
        <label>예약자 이름 <input id="fName" data-ime="ko"></label>
        <label>예약자 연락처 <input id="fPhone" inputmode="tel"></label>
        <label>예약 번호 <input id="fNo"></label>
      </div>
      <div class="cx-row">
        <div class="cx-f"><span class="lb">취소 내용</span><span class="seg" id="fKind"><button type="button" data-v="전체 환불" class="on">전체 환불</button><button type="button" data-v="부분 취소">부분 취소</button></span></div>
        <!-- 부분 취소 (2026-11-23): 몇 명을 취소할지 · 예약 인원(전산 예약에서)보다 많으면 에러 -->
        <label id="fPplBox" hidden>예약 인원 <span class="cx-cnt"><input type="number" id="fPpl" min="1" step="1" inputmode="numeric"> 명</span></label>
        <label id="fCntBox" hidden>취소할 인원 <span class="cx-cnt"><input type="number" id="fCnt" min="1" step="1" inputmode="numeric"> 명</span></label>
        <p class="cx-cnt-msg" id="fCntMsg" hidden></p>
      </div>
      <!-- 취소 사유 (2026-11-23): 하나만 고름 · 「기타」면 사유 자세히 -->
      <div class="cx-row">
        <div class="cx-f"><span class="lb">취소 사유</span><span class="seg" id="fWhy"><button type="button" data-v="고객 직접 취소 불가">고객 직접 취소 불가</button><button type="button" data-v="날씨 (폭우 · 태풍)">날씨 (폭우 · 태풍)</button><button type="button" data-v="질병 · 사고">질병 · 사고</button><button type="button" data-v="기타">기타</button></span></div>
        <label class="grow" id="fWhyTxtBox" hidden>사유 자세히 <input id="fWhyTxt" data-ime="ko" placeholder="예: 차량 고장으로 당일 방문 불가"></label>
      </div>
      <!-- 증빙 서류 + 올리기 (2026-11-23): PDF · JPG · PNG · 나중에 요청 목록에서도 올릴 수 있음 -->
      <div class="cx-row">
        <div class="cx-f"><span class="lb">증빙 서류</span><span class="seg" id="fDoc"><button type="button" data-v="" class="on">필요 없음</button><button type="button" data-v="받음">받음</button><button type="button" data-v="받을 예정">받을 예정</button></span></div>
        <div class="cx-f grow" id="fFilesRow" hidden><span class="lb">증빙 서류 파일 <small>PDF · JPG · PNG, 10MB 이하 · 나중에 요청 목록에서 올려도 됩니다</small></span>
          <div class="cx-files"><span id="fFiles"></span><label class="btn line-g cx-up" id="fUpBtn">증빙 서류 올리기<input type="file" id="fUp" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple hidden></label></div></div>
      </div>
      <!-- 환불 계좌 (2026-11-23): 은행(고르기) · 계좌번호 · 예금주(본인 = 예약자 / 타인이면 이름) -->
      <div class="cx-f cx-acc"><span class="lb">환불 계좌 (가상계좌 결제 시 추가)</span>
        <div class="cx-row">
          <label>은행 <select id="fBank"><option value="">은행 고르기</option><option>KB국민은행</option><option>신한은행</option><option>우리은행</option><option>하나은행</option><option>NH농협은행</option><option>지역농협 · 축협</option><option>IBK기업은행</option><option>iM뱅크 (대구은행)</option><option>BNK부산은행</option><option>BNK경남은행</option><option>광주은행</option><option>전북은행</option><option>제주은행</option><option>SC제일은행</option><option>한국씨티은행</option><option>KDB산업은행</option><option>수협은행</option><option>새마을금고</option><option>신협</option><option>우체국</option><option>저축은행</option><option>카카오뱅크</option><option>케이뱅크</option><option>토스뱅크</option><option>기타</option></select></label>
          <label class="grow">계좌번호 <input id="fAccNo" inputmode="numeric" autocomplete="off"></label>
          <div class="cx-f"><span class="lb">예금주</span><span class="seg" id="fAccOwn"><button type="button" data-v="본인" class="on">본인 계좌</button><button type="button" data-v="타인">타인 계좌</button></span></div>
          <label id="fAccNameBox">예금주 이름 <input id="fAccName" data-ime="ko" title="본인 계좌면 예약자 이름이 들어갑니다 (고칠 수 있음)"></label>
        </div>
      </div>
      <div class="cx-btns"><button type="button" class="btn" id="fReset">비우기</button><button type="button" class="btn" id="fEditCancel" hidden>고치기 그만</button><button type="button" class="btn primary" id="fSend">취소 요청 보내기</button></div>
    </div>
  </section>

  <!-- ② 요청 목록 · 처리 -->
  <section class="panel" id="pList">
    <!-- 2026-11-23: 제목 · 처리 전/완료/전체 · 정보 덜 된 것만 · 찾기 · 엑셀 불러오기를 한 줄에 -->
    <div class="cx-lh"><h2>요청 목록 · 처리 <b class="cx-n" id="openN" title="처리 전"></b></h2>
      <span class="seg" id="flt"><button type="button" data-v="open" class="on">처리 전</button><button type="button" data-v="done">처리 완료</button><button type="button" data-v="all">전체</button></span>
      <label class="cx-ck"><input type="checkbox" id="fltMiss"> 정보 덜 된 것만 <b id="missN"></b></label>
      <input id="q" type="search" placeholder="예약자 · 연락처 · 예약 번호 · 요청자로 찾기" data-ime="ko" autocomplete="off">
      <button class="btn line-g" id="xlBtn" type="button" title="예전에 쓰던 「사유원 예약 취소 요청」 엑셀을 넣으면 그 줄들을 목록에 더함">📥 엑셀 불러오기</button><input type="file" id="xlFile" accept=".xlsx,.xls" hidden></div>
    <p class="cx-sum" id="sum"></p>
    <div id="list"></div>
  </section>
  </div>
</main>

<div class="pmodal" id="askModal" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">확인</h2>
    <div id="askMsg"></div>
    <div class="dm-btns"><button class="btn" id="askNo" type="button">취소</button><button class="btn primary" id="askYes" type="button">확인</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/common.js?v=20261126zo"></script>
<script src="js/cancel.js?v=20261126zo"></script>
<script src="js/menu.js?v=20261126zo"></script>
</body>
</html>
