<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사고현황 접수 · 사유원 운영 보조 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem(((location.pathname.indexOf("/sayuwon-sales/test/")===0?"test:":"")+"sy_user"))||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/ops.css?v=20261128zh">
<link rel="stylesheet" href="css/accident.css?v=20261128zh">
<link rel="stylesheet" href="css/mypop.css?v=20261128zh">
<link rel="stylesheet" href="css/menu.css?v=20261128zh">
</head>
<body>
<!-- 사고현황 접수 (칸 · 목록 · 담당자 · 추후과업 · 메모는 js/accident.js · 저장과 접수 창은 js/opsboard.js · 모양은 css/accident.css · 2026-11-28 다시 만듦) -->
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 운영 보조 시스템</a><span class="sys-crumb" id="crumb"></span>
  <span class="me" id="me"></span>
  <button type="button" class="hd-btn" data-mypop title="내 개인고객 통화 · 단체 예약의 추후 과업을 한눈에 (팝업)">나의 할일</button>
  <button type="button" class="hd-btn acc-new" id="accNewBtn">＋ 새 접수</button>
  <button type="button" class="hd-btn" id="accListBtn">사고 목록</button>
  <button type="button" class="ko-toggle on" id="ko-toggle" aria-pressed="true">한</button>
</header>
<main>
  <div id="keyBox" class="panel keybox" hidden>
    <p>로그인 정보를 확인할 수 없습니다. <a href="./">첫 화면</a>에서 다시 로그인해 주세요.</p>
    <p class="err" id="keyErr"></p>
  </div>

  <!-- 첫 화면 = 사고 한 건을 접수 · 고치는 곳 (2026-11-28 · 단체 화면처럼 · 창이 아니라 화면에 늘 떠 있음 · js/accident.js 「첫 화면」) -->
  <!-- 처음 들어오면: 사고를 먼저 찾기 (단체 화면의 첫 화면처럼 · 사고를 열거나 새 접수를 시작하면 걷힘 · js/accident.js 「첫 화면의 찾기」) -->
  <section class="acc-start" id="accStart" aria-labelledby="accStartTitle">
    <h2 id="accStartTitle">어느 사고인가요?</h2>
    <input id="accStartQ" class="acc-start-q" type="search" data-ime="ko" lang="ko" placeholder="장소 · 이름 · 내용을 입력하세요" autocomplete="off" spellcheck="false">
    <ul class="acc-start-list" id="accStartList"></ul>
    <div class="row-btns"><button type="button" class="btn primary" id="accStartNew">새 사고 접수</button></div>
  </section>
  <div class="acc-page" id="editModal" hidden>
  <section class="panel edit-box" aria-labelledby="eTitle">
    <div class="acc-head"><h2 id="eTitle"></h2><p class="err" id="eErr"></p><label class="acc-owner">담당자 <select id="accOwnerSel"></select></label>
      <div class="row-btns"><button type="button" class="btn" id="eDel" hidden>삭제</button><button type="button" class="btn" id="accCopy">보고 글 복사</button><button type="submit" form="eForm" class="btn primary" id="eSave">저장</button></div></div>
    <p class="acc-lock" id="accLock" hidden></p>
    <div class="acc-tabs" id="accTabs" hidden><button type="button" data-acctab="side">진행 · 메모</button><button type="button" data-acctab="info">사고 내용</button></div>
    <form id="eForm" autocomplete="off"><div class="acc-cols"><div class="acc-main"><div class="egrid" id="eFields"></div>
      </div>
      <aside class="acc-side" id="accSide" hidden></aside></div>
    </form>
  </section>
  </div>
</main>

<!-- 사고 목록 (헤더의 「사고 목록」 단추로 엶) -->
<div class="modal" id="accListModal" hidden>
  <section class="panel acc-list" id="board" role="dialog" aria-modal="true" aria-labelledby="bTitle">
    <div class="b-head"><h2 id="bTitle"></h2><span class="hint" id="bSum"></span><span class="sync" id="sync"></span>
      <span class="b-tools"><input id="q" type="search" placeholder="찾기 (장소 · 이름 · 내용)" data-ime="ko" autocomplete="off"><button type="button" class="btn primary" id="addBtn">＋ 추가</button></span></div>
    <button type="button" class="win-x" id="accListX" title="닫기" aria-label="닫기">×</button>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
</div>
<!-- 삭제 확인 -->
<div class="modal" id="askModal" hidden>
  <section class="panel ask-box" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">삭제 확인</h2><p id="askMsg"></p>
    <div class="row-btns"><span class="sp"></span><button type="button" class="btn" id="askNo">취소</button><button type="button" class="btn primary" id="askYes">삭제</button></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/common.js?v=20261128zh"></script>
<script src="js/opslib.js?v=20261128zh"></script>
<script src="js/accident.js?v=20261128zh"></script>
<script src="js/opsboard.js?v=20261128zh"></script>
<div class="mypop" id="myPop" hidden><div class="box"><iframe id="myPopFrame" title="나의 할일"></iframe></div></div>
<script src="js/mypop.js?v=20261128zh"></script>
<script src="js/ime.js?v=20261128zh"></script>
<script src="js/keepsize.js?v=20261128zh"></script>
<script src="js/menu.js?v=20261128zh"></script>
<script src="js/timepick.js?v=20261128zh"></script>
</body>
</html>
