<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사유원 예약 접수 도우미</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 왼쪽: 통화 메모(대충 쳐도 됨) · 가운데: 엑셀 형식 칸 · 오른쪽: 물어볼 것/복창 */
:root{
  --bg:#f3f1ec; --card:#fffefb; --ink:#262620; --muted:#77736a; --line:#dfdace;
  --pine:#3f5236; --pine-soft:#e4eadf; --amber:#b0742a; --amber-soft:#f8ecd9;
  --red:#a4442c; --red-soft:#f6e1da; --fill:#fff6c9;
  --serif:"Noto Serif KR",serif; --sans:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* 숨긴 요소는 자기 display 스타일이 있어도 숨김 (비밀번호 칸·전화 필요 표시) */
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
header{background:var(--pine);color:#f3f1ec;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font:600 18px var(--serif);margin:0;letter-spacing:.03em}
header .who{display:flex;align-items:center;gap:6px;font-size:12px}
header .who input{width:90px;border:0;border-radius:6px;padding:4px 8px;font:13px var(--sans)}
header .timer{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;opacity:.9}
header .keys{font-size:11px;opacity:.75}
.ko-toggle{width:30px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#f3f1ec;font:700 13px var(--sans);cursor:pointer}
.ko-toggle.on{background:#f3f1ec;color:var(--pine)}
.vrow{display:flex;gap:4px}
.vrow select{border:1px solid var(--line);border-radius:6px;padding:5px 4px;font:13px var(--sans);background:#fff;color:var(--ink)}
.vrow input{min-width:0}
header .sync{font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
header .sync.ok{background:#cfe3c6;color:var(--pine)}
header .sync.warn{background:#f3d9b5;color:#6b4513}
.keybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
.keybar input{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:13px var(--sans);width:160px}
#keyMsg{color:var(--red)}
/* 순서: 예약 내용 · 통화 중 확인 · 통화 메모 */
.layout{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(280px,.9fr) minmax(300px,1fr);gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));align-items:start}
.form-col{order:1}.checks{order:2}.memo-col{order:3}
@media (max-width:1180px){.layout{grid-template-columns:1fr 1fr}.memo-col{grid-column:1 / -1}}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font:600 15px var(--serif);margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font:400 12px var(--sans);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:8px 13px;font:500 13px var(--sans);cursor:pointer}
.btn:hover{border-color:var(--pine)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn kbd{font:11px ui-monospace,Consolas,monospace;opacity:.7;margin-left:4px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.memo-wrap{position:sticky;top:12px}
#memoBox{width:100%;min-height:min(58vh,520px);resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;font:15px/1.7 var(--sans);background:#fff;color:var(--ink)}
#memoBox:focus{border-color:var(--pine)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.ex{background:var(--bg);border-radius:6px;padding:6px 9px;font-size:12.5px;color:var(--muted);margin-top:8px}
.ex code{font:12.5px var(--sans);color:var(--ink)}
/* 통화 구분 */
.ctype{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.ctype-l{font-size:12px;font-weight:700;color:var(--muted)}
.seg{display:flex;background:var(--card);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font:500 13px var(--sans);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--pine);color:#fff}
.seg button.guess:not(.on){outline:1px dashed var(--pine);outline-offset:-2px;color:var(--pine)}
/* 칸 */
.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.grp:first-of-type{border-top:0;margin-top:0;padding-top:0}
.grp-t{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:700}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
@media (max-width:560px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1 / -1}
.f label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.f label .col{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#a9a497}
.f input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13.5px var(--sans);background:#fff;color:var(--ink);min-width:0}
.f.req label::after{content:" *";color:var(--red)}
.f.auto input{background:var(--fill)}
.f.unsure input{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.f.missing input{border-style:dashed;border-color:#c9b9b2}
#form.dim{opacity:.45}
#summaryRow{margin-bottom:10px}
/* 확인 */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk li{border-radius:7px;padding:8px 10px;font-size:13px}
.chk.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.chk.miss li{background:var(--red-soft);padding:6px 8px;text-align:center}
.chk.miss li b{color:var(--red)}
.chk.unsure li{background:var(--amber-soft)}
.chk.unsure li b{color:var(--amber)}
.chk li .q{display:block;color:var(--ink);margin-top:2px}
.chk li .q::before{content:"→ ";color:var(--muted)}
.done-all{background:var(--pine-soft);color:var(--pine);border-radius:7px;padding:10px;font-size:13px}
.readback{background:var(--bg);border-radius:8px;padding:12px;font-size:13.5px;line-height:1.7}
.sub-h{font:600 13px var(--sans);margin:16px 0 6px}
.sub-h:first-child{margin-top:0}
.status{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
/* 목록 */
.list{margin:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.list .tw{overflow-x:auto}
.list table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.list th,.list td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
.list th{color:var(--muted);font-weight:500;font-size:12px}
.list tr.r{cursor:pointer}.list tr.r:hover td{background:#faf8f2}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--pine-soft);color:var(--pine);font-weight:700}
.tag.etc{background:#ece9e2;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* 담당자 여러 명 */
.contacts{display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) 28px;gap:8px;align-items:end}
@media (max-width:560px){.crow{grid-template-columns:1fr 1fr}}
.crow .x{border:1px solid var(--line);background:var(--card);border-radius:6px;height:31px;cursor:pointer;color:var(--muted)}
.crow .x:hover{border-color:var(--red);color:var(--red)}
.addc{align-self:flex-start;margin-top:2px;padding:4px 10px;font-size:12px}
.grp-t{display:flex;justify-content:space-between;align-items:center}
/* 그날 예약 현황 */
.dayinfo{margin-top:8px;background:var(--pine-soft);border-radius:8px;padding:8px 10px;font-size:12.5px;min-height:36px}
.dayinfo b{color:var(--pine)}
.dayinfo ul{margin:4px 0 0;padding-left:16px}
.dayinfo .none{color:var(--muted)}
.dayinfo .adm{margin-top:6px;padding-top:6px;border-top:1px dashed #bccab4}
.dayinfo .adm .full{color:var(--red)}
.tag.call{background:var(--red-soft);color:var(--red)}
.list h2 .row-btns{margin-left:auto}
.f.hot input{border-color:var(--pine);box-shadow:0 0 0 1px var(--pine) inset}
/* 물어볼 것: 받은 항목은 초록 */
.chk.miss li.got{background:var(--pine-soft)}
.chk.miss li.got b{color:var(--pine)}
/* 목록 창 */
.list-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#f3f1ec;border-radius:7px;padding:4px 12px;font:500 13px var(--sans);cursor:pointer;display:flex;gap:6px;align-items:center}
.list-btn:hover{background:rgba(255,255,255,.2)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(30,30,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .list{margin:0;width:min(1200px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.modal .list .tw{overflow:auto;flex:1;min-height:0}
.modal .list h2{flex-wrap:wrap}
/* 사담·마방·프로그램 접기 */
.opt-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.opt-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;font:500 13.5px var(--sans);color:var(--ink);cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center}
.opt-btn small{color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-btn::after{content:"▾";color:var(--muted)}
.opt-btn[aria-expanded="true"]::after{content:"▴"}
.opt-btn.filled{background:var(--pine);border-color:var(--pine);color:#fff}
.opt-btn.filled small,.opt-btn.filled::after{color:#dfe8da}
.opt-btn[aria-expanded="true"]:not(.filled){border-color:var(--pine)}
.grp.opt{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;border-top:0}
.grp.opt.filled{background:var(--pine-soft);box-shadow:inset 3px 0 0 var(--pine)}
.f input.has{border-color:#9db394;background:#f6faf3}
</style>
</head>
<body>
<header>
  <h1>思惟園 예약 접수 도우미</h1>
  <button type="button" class="ko-toggle on" id="ko-toggle" aria-pressed="true">한</button>
  <span class="timer" id="timer"></span>
  <button type="button" class="list-btn" id="listOpenBtn">단체예약 목록 <span id="listCount"></span><span class="tag call" id="callCount" hidden></span></button>
  <span class="sync" id="syncChip"></span>
  <span class="keys">Ctrl+S 저장 · Alt+N 새 통화</span>
</header>
<form class="keybar" id="keyForm" hidden>
  <span>공유 기록을 보려면 팀 비밀번호를 넣어 주세요. 이 브라우저에 기억됩니다.</span>
  <input type="password" id="keyInput" placeholder="팀 비밀번호" autocomplete="off">
  <button class="btn primary" type="submit">연결</button>
  <span id="keyMsg"></span>
</form>

<div class="layout">
  <!-- 통화 메모 -->
  <section class="panel memo-col">
    <div class="memo-wrap">
      <h2>통화 메모 <small>칸에 없는 특이사항을 적어 두세요</small></h2>
      <textarea id="memoBox" placeholder="예)
휠체어 이용 2명
대표님 동행, 도착 전 연락 요청
해설은 건축 위주로 부탁
견적서 금요일까지 필요"></textarea>
      <div class="row-btns" style="margin-top:10px">
        <button class="btn" id="clearMemoBtn">메모 지우기</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </section>

  <!-- 예약 칸 -->
  <section class="panel form-col">
    <h2>예약 내용</h2>
    <form id="form" autocomplete="off"></form>
    <div class="row-btns" style="margin-top:10px">
      <button class="btn primary" id="saveBtn">저장<kbd>Ctrl+S</kbd></button>
      <button class="btn" id="copyRowBtn">엑셀 행 복사 (D~V열)</button>
      <button class="btn" id="copyTextBtn">내용 텍스트 복사</button>
      <button class="btn" id="newBtn">새 통화<kbd>Alt+N</kbd></button>
    </div>
    <p class="hint">엑셀 메인 시트에서 해당 날짜 행의 <b>D열(업체)</b> 칸을 선택하고 Ctrl+V 하면 V열(유루 캐빈)까지 들어갑니다.</p>
  </section>

  <!-- 확인 -->
  <section class="panel checks">
    <h2>통화 중 확인</h2>
    <div class="sub-h">물어볼 것 <small class="hint" style="margin:0">받은 항목은 초록색</small></div>
    <div id="missBox"></div>
    <div class="sub-h">다시 확인할 것</div>
    <div id="unsureBox"></div>
    <div class="sub-h">끊기 전 복창</div>
    <div class="readback" id="readback"></div>
    <div class="row-btns" style="margin-top:8px"><button class="btn" id="copyReadBtn">복창 문구 복사</button></div>
  </section>
</div>

<!-- 단체예약 목록 (위쪽 버튼으로 여는 창) -->
<div class="modal" id="listModal" hidden>
  <section class="list panel" role="dialog" aria-modal="true" aria-labelledby="listTitle">
    <h2><span id="listTitle">단체예약 목록</span> <small id="storeHint"></small>
      <span class="row-btns"><small id="adminHint"></small><button type="button" class="btn" id="adminSyncBtn" style="padding:4px 10px;font-size:12px">관리자 사이트에서 지금 가져오기</button><button type="button" class="btn" id="listCloseBtn" style="padding:4px 10px;font-size:12px">닫기 (Esc)</button></span></h2>
    <div class="tw"><table><thead><tr><th>방문일</th><th>업체</th><th>담당자</th><th>연락처</th><th>인원</th><th>입퇴장</th><th>식사</th><th>영업 담당</th><th>접수</th><th></th></tr></thead><tbody id="listBody"></tbody></table></div>
    <div class="row-btns" style="margin-top:10px"><button class="btn" id="copyAllBtn">전체 엑셀 행 복사</button></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hangul-js@0.2.6/hangul.min.js"></script>
<script>
// ===================== 필드 정의 (엑셀 메인 시트 열 기준) =====================
// grp, key, label, 엑셀열, 너비, 물어볼 질문(필수)
const FIELDS = [
  ['기본','org','업체(단체명)','D','w2','단체명(기관명)이 어떻게 되실까요?'],
  ['기본','date','방문일','B','',  '방문 날짜가 언제로 생각하고 계실까요?'],
  ['기본','people','관람 인원','I','',  '방문 인원은 총 몇 분이세요? (인솔자·기사님 포함 여부도)'],
  ['방문','tin','입장','H','',  '몇 시쯤 도착 예정이세요?'],
  ['방문','tout','퇴장','H','',  '나가시는 시간은 몇 시쯤으로 보시나요?'],
  ['방문','vehicle','차량','G','',  '버스로 오세요, 승용차로 오세요? 몇 대인가요?'],
  ['방문','owner','영업 담당','E','',  null],
  ['방문','pay','결제','F','w2','결제는 사전 계좌이체와 현장 결제 중 어떻게 하실까요?'],
  ['방문','meal','식사 여부','','w2','식사는 사담이나 몽몽마방 이용하실 계획 있으세요?'],
  ['사담','sadam1','1부','J','',null],
  ['사담','sadam2','2부','K','',null],
  ['사담','sadamD','디너','L','',null],
  ['몽몽마방','mabangL','런치','M','',null],
  ['몽몽마방','mabangD','디너','N','',null],
  ['몽몽마방','mabangMenu','메뉴','','w2',null],
  ['프로그램','chabang','차방','O','',null],
  ['프로그램','donghaeng','동행','P','',null],
  ['프로그램','dangdu','당두','Q','',null],
  ['프로그램','yoga','요가/명상','R','',null],
  ['프로그램','gaga','가가 바우처','S','',null],
  ['프로그램','teaMed','티하우스 명상','T','',null],
  ['프로그램','gayageum','가야금','U','',null],
  ['프로그램','cabin','유루 캐빈','V','',null],
];
// 담당자(여러 명): c0_name, c0_phone, c0_email, c1_name …
const CFIELDS = [['name','담당자 성함','담당자분 성함이 어떻게 되세요?'],['phone','연락처','연락 가능한 번호 하나 남겨주시겠어요?'],['email','이메일','견적서 받으실 이메일 주소 알려주시겠어요?']];
const KEYS = FIELDS.map(f=>f[1]);
// 처음엔 접어 두고 버튼으로 펼치는 묶음 (각 묶음 아래에 그날 예약 현황)
const OPT = { '사담':{id:'sadam', title:'사담 식사'}, '몽몽마방':{id:'mabang', title:'몽몽마방 식사'}, '프로그램':{id:'prog', title:'프로그램'} };
let optOpen = new Set();
const GROUP_OF = Object.fromEntries(FIELDS.map(f=>[f[1], f[0]]));
const LABEL = Object.fromEntries(FIELDS.map(f=>[f[1], ['사담','몽몽마방'].includes(f[0]) ? `${f[0]} ${f[2]}` : f[2]]));
CFIELDS.forEach(([f,l])=>{ for(let i=0;i<10;i++) LABEL[`c${i}_${f}`]= i? `${l}(${i+1})` : l; });
const EXCEL_COLS = ['D','E','F','G','H','I','J','K','L','M','N','O','P','Q','R','S','T','U','V'];
const EXCEL_HEAD = {D:'업체',E:'담당',F:'결제',G:'차량',H:'입퇴장',I:'관람',J:'사담 1부',K:'사담 2부',L:'사담 디너',M:'마방 런치',N:'마방 디너',O:'차방',P:'동행',Q:'당두',R:'요가/명상',S:'가가',T:'티 명상',U:'가야금',V:'유루 캐빈'};
const DOW = '일월화수목금토';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isCKey = k => /^c\d+_(name|phone|email)$/.test(k);

// ===================== 상태 =====================
let rec, touched, startedAt, editingId, nContacts;
let cache=[];
function savedOwner(){ try{ return localStorage.getItem('sayuwon_owner')||''; }catch(_){ return ''; } }
function blank(){ const o={}; KEYS.forEach(k=>o[k]=''); o.owner=savedOwner(); return o; }
function resetState(){ rec=blank(); touched=new Set(['owner']); startedAt=null; editingId=null; nContacts=1; optOpen=new Set(); }
function contactsOf(r){
  const out=[]; for(let i=0;i<nContactsOf(r);i++){ const c={name:r[`c${i}_name`]||'',phone:r[`c${i}_phone`]||'',email:r[`c${i}_email`]||''}; if(c.name||c.phone||c.email) out.push(c); } return out;
}
function nContactsOf(r){ let n=0; Object.keys(r).forEach(k=>{ const m=k.match(/^c(\d+)_/); if(m && r[k]) n=Math.max(n,+m[1]+1); }); return n; }
function joinContacts(r){ const cs=contactsOf(r); return { contact:cs.map(c=>c.name).join(' / '), phone:cs.map(c=>c.phone).join(' / '), email:cs.map(c=>c.email).join(' / ') }; }
function splitContacts(r){   // 시트에서 읽은 "가 / 나" 를 담당자 줄로
  const sp=v=>String(v||'').split(/\s*\/\s*/);
  const a=sp(r.contact), b=sp(r.phone), c=sp(r.email); const n=Math.max(a.length,b.length,c.length);
  const o={}; for(let i=0;i<n;i++){ o[`c${i}_name`]=(a[i]||'').trim(); o[`c${i}_phone`]=(b[i]||'').trim(); o[`c${i}_email`]=(c[i]||'').trim(); } return o;
}
const allKeys = () => { const ks=[...KEYS]; for(let i=0;i<nContacts;i++) CFIELDS.forEach(([f])=>ks.push(`c${i}_${f}`)); return ks; };
const REQUIRED = () => [...FIELDS.filter(f=>f[5]).map(f=>[f[1],f[2],f[5]]), ...CFIELDS.map(([f,l,q])=>[`c0_${f}`,l,q])];

// ===================== 칸 렌더 =====================
// 칸별 입력 방식: 한글 우선(한/영 키로 영어) · 영어 고정 · 숫자 고정
const KO_FIRST = k => k==='org' || /^c\d+_name$/.test(k) || k==='owner';
const EN_ONLY  = k => /^c\d+_email$/.test(k);
const NUM_ONLY = { people:/[^\d+]/g, vehicle:/[^\d]/g };   // 관람 인원은 42+2 처럼 + 허용
const VTYPES = ['버스','승용','혼합'];
function vehParts(v){ v=String(v||''); const t=VTYPES.find(x=>v.includes(x)) || (/(대형|중형|소형|미니)/.test(v)?'버스':''); const n=(v.match(/\d+/)||[''])[0]; return {t,n}; }
function vehJoin(t,n){ return n ? `${t||'버스'} ${n}대` : (t && t!=='버스' ? t : ''); }
function fieldHTML(k,label,col,cls,req){
  let extra = k==='date'?' type="date"':'';
  if(k==='owner') extra+=' list="owners"';
  if(KO_FIRST(k)) extra+=' data-ime="ko"';
  if(EN_ONLY(k))  extra+=' data-ime="en" inputmode="email" lang="en" autocapitalize="off" spellcheck="false"';
  if(NUM_ONLY[k]) extra+=' inputmode="numeric" data-ime="num"';
  const input = k==='vehicle'
    ? `<div class="vrow"><select id="f_vtype" data-k="vehicle" aria-label="차종">${VTYPES.map(t=>`<option>${t}</option>`).join('')}</select><input id="f_${k}" data-k="${k}"${extra} placeholder="대수"></div>`
    : `<input id="f_${k}" data-k="${k}"${extra}>`;
  return `<div class="f ${cls}${req?' req':''}" id="w_${k}"><label for="f_${k}"><span>${label}</span>${col?`<span class="col">${col}</span>`:''}</label>${input}</div>`;
}
function buildForm(){
  const req=new Set(REQUIRED().map(r=>r[0]));
  let html='', g='';
  const close=()=>{ if(!g) return; html+='</div>'; if(OPT[g]) html+=`<div class="dayinfo" id="info_${OPT[g].id}"></div>`; html+='</div>'; };
  FIELDS.forEach(([grp,k,label,col,cls])=>{
    if(grp!==g){
      close();
      if(OPT[grp] && !Object.keys(OPT).some(x=>x===g)){   // 첫 접는 묶음 앞에 버튼 3개
        html+=`<div class="opt-bar">${Object.values(OPT).map(o=>`<button type="button" class="opt-btn" data-opt="${o.id}" aria-expanded="false"><span>${o.title}</span><small id="optsum_${o.id}"></small></button>`).join('')}</div>`;
      }
      html+= OPT[grp]
        ? `<div class="grp opt" id="opt_${OPT[grp].id}" hidden><div class="grp-t"><span>${OPT[grp].title}</span></div><div class="fields">`
        : `<div class="grp" data-grp="${grp}"><div class="grp-t"><span>${grp}</span></div><div class="fields">`;
      g=grp;
    }
    html += fieldHTML(k,label,col,cls,req.has(k));
    if(k==='people') html += `</div></div><div class="grp" data-grp="담당자"><div class="grp-t"><span>담당자</span><span class="hint" style="margin:0">여러 명이면 추가</span></div><div class="contacts" id="contacts"></div><button type="button" class="btn addc" id="addContact">+ 담당자 추가</button>` + `<div class="fields" hidden>`;
  });
  close();
  $('#form').innerHTML = html + '<datalist id="owners"><option>이상운</option><option>혜린</option></datalist>';
  // 사담 줄은 4칸 중 3칸만 쓰므로 빈 칸 하나
  document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=()=>{
    const id=b.dataset.opt; optOpen.has(id) ? optOpen.delete(id) : optOpen.add(id); paintOpt();
    if(optOpen.has(id)) document.querySelector(`#opt_${id} input`)?.focus();
  });
  $('#addContact').onclick=()=>{ nContacts++; renderContacts(); document.getElementById(`f_c${nContacts-1}_name`).focus(); };
  $('#form').addEventListener('input', e=>{
    const k=e.target.dataset.k; if(!k) return;
    if(NUM_ONLY[k] && e.target.tagName==='INPUT' && !e.isComposing){ const c=e.target.value.replace(NUM_ONLY[k],''); if(c!==e.target.value){ const p=e.target.selectionStart-(e.target.value.length-c.length); e.target.value=c; try{ e.target.setSelectionRange(p,p); }catch(_){} } }
    rec[k]= k==='vehicle' ? vehJoin($('#f_vtype').value, $('#f_vehicle').value) : e.target.value;
    touched.add(k);
    if(k==='owner'){ try{ localStorage.setItem('sayuwon_owner', e.target.value); }catch(_){} }
    if(k==='date') renderInfo();
    startTimer(); paintFields(); renderSide();
  });
  $('#form').addEventListener('click', e=>{
    const x=e.target.closest('.x'); if(!x) return;
    const i=+x.dataset.i;
    for(let j=i;j<nContacts-1;j++) CFIELDS.forEach(([f])=>{ rec[`c${j}_${f}`]=rec[`c${j+1}_${f}`]||''; if(touched.has(`c${j+1}_${f}`)) touched.add(`c${j}_${f}`); });
    CFIELDS.forEach(([f])=>{ delete rec[`c${nContacts-1}_${f}`]; });
    nContacts=Math.max(1,nContacts-1); renderContacts(); renderForm();
  });
  // Enter로 다음 칸
  $('#form').addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.isComposing || e.target.tagName!=='INPUT') return; e.preventDefault();
    const ins=[...document.querySelectorAll('#form input')]; const i=ins.indexOf(e.target); if(ins[i+1]) ins[i+1].focus();
  });
  // 식사·프로그램 칸에 커서(마우스·입력)를 두면 그날 그 칸의 예약 현황
  const hot = e=>{ const w=e.target.closest('.f'); const k=w?.querySelector('input')?.dataset.k; if(k && INFO_OF(k)) renderInfo(k); };
  $('#form').addEventListener('mouseover', hot);
  $('#form').addEventListener('focusin', hot);
  $('#form').addEventListener('mouseleave', ()=>{ const a=document.activeElement?.dataset?.k; renderInfo(a && INFO_OF(a) ? a : null); });
  renderContacts();
}
function renderContacts(){
  const req=new Set(REQUIRED().map(r=>r[0]));
  let h='';
  for(let i=0;i<nContacts;i++){
    h+=`<div class="crow">${CFIELDS.map(([f,l])=>fieldHTML(`c${i}_${f}`, l, '', '', req.has(`c${i}_${f}`))).join('')}${i?`<button type="button" class="x" data-i="${i}" title="이 담당자 빼기">×</button>`:'<span></span>'}</div>`;
  }
  $('#contacts').innerHTML=h;
  for(let i=0;i<nContacts;i++) CFIELDS.forEach(([f])=>{ const k=`c${i}_${f}`; document.getElementById('f_'+k).value=rec[k]||''; });
  paintFields();
}
function paintFields(changed=[]){
  const req=new Set(REQUIRED().map(r=>r[0]));
  allKeys().forEach(k=>{
    const el=document.getElementById('f_'+k); if(!el) return;
    const v=rec[k]||'';
    if(k==='vehicle'){ const p=vehParts(v); if(document.activeElement!==el && el.value!==p.n) el.value=p.n; if(p.t && document.activeElement!==$('#f_vtype')) $('#f_vtype').value=p.t; }
    else if(el.value!==v && document.activeElement!==el) el.value=v;
    const w=document.getElementById('w_'+k);
    w.classList.toggle('unsure', fieldWarnings(rec).some(u=>u.field===k));
    w.classList.toggle('missing', req.has(k) && !v);
    if(OPT[GROUP_OF[k]]) el.classList.toggle('has', !!v);
  });
  paintOpt();
}
// 접는 묶음: 값이 있으면 버튼·묶음을 초록으로, 버튼에 입력 내용 요약
function paintOpt(){
  Object.entries(OPT).forEach(([grp,o])=>{
    const keys=FIELDS.filter(f=>f[0]===grp).map(f=>f[1]);
    const filled=keys.filter(k=>rec[k]);
    const sum=filled.map(k=>{ const v=rec[k]; return `${FIELDS.find(f=>f[1]===k)[2]} ${/^\d+(\+\d+)*$/.test(v)?v+'명':v}`; }).join(' · ');
    const b=document.querySelector(`.opt-btn[data-opt="${o.id}"]`), box=document.getElementById('opt_'+o.id);
    if(!b||!box) return;
    b.classList.toggle('filled', filled.length>0);
    b.setAttribute('aria-expanded', optOpen.has(o.id)?'true':'false');
    document.getElementById('optsum_'+o.id).textContent = sum || '없음';
    b.title = sum || `${o.title} 입력 없음 · 누르면 펼침`;
    box.hidden = !optOpen.has(o.id);
    box.classList.toggle('filled', filled.length>0);
  });
}
function renderForm(changed=[]){
  const need=Math.max(1, nContactsOf(rec));
  if(need>nContacts){ nContacts=need; renderContacts(); }
  paintFields(changed);
  renderSide();
}
function dateLabel(d){ if(!d) return ''; const t=new Date(d+'T00:00'); return isNaN(t)?d:`${t.getMonth()+1}/${t.getDate()}(${DOW[t.getDay()]})`; }
function excelRow(r){
  const names = r.contact!=null && !nContactsOf(r) ? String(r.contact).split(' / ').filter(Boolean).join(', ') : contactsOf(r).map(c=>c.name).filter(Boolean).join(', ');
  const org = r.org + (names?`(${names})`:'');
  const time = (r.tin||r.tout)?`${r.tin||''}~${r.tout||''}`:'';
  const map = {D:org,E:r.owner,F:r.pay,G:r.vehicle,H:time,I:r.people,J:r.sadam1,K:r.sadam2,L:r.sadamD,M:r.mabangL,N:r.mabangD,O:r.chabang,P:r.donghaeng,Q:r.dangdu,R:r.yoga,S:r.gaga,T:r.teaMed,U:r.gayageum,V:r.cabin};
  return EXCEL_COLS.map(c=>map[c]||'');
}
function renderSide(){
  const req = REQUIRED(), miss = req.filter(([k])=>!rec[k]);
  // 물어볼 것: 전부 보여 주고, 받은 항목은 초록색
  $('#missBox').innerHTML = `<ul class="chk miss">${req.map(([k,l,q])=>`<li class="${rec[k]?'got':''}" title="${q}"><b>${l}</b></li>`).join('')}</ul>`
    + (miss.length ? '' : `<div class="done-all" style="margin-top:6px">필수 정보를 모두 받았습니다. 복창하고 저장하세요.</div>`);
  const items = fieldWarnings(rec).map(u=>`<li><b>${LABEL[u.field]||u.field}</b> ${esc(rec[u.field]||'')}<span class="q">${esc(u.reason)}</span></li>`);
  $('#unsureBox').innerHTML = items.length ? `<ul class="chk unsure">${items.join('')}</ul>` : `<p class="hint" style="margin:0">지난 날짜, 입퇴장 시간 뒤바뀜, 사담·마방 자리 부족이면 여기에 표시합니다.</p>`;
  $('#readback').textContent = readback(rec);
  renderInfo(curInfoKey);
}
function readback(r){
  const p=[];
  if(r.date){ const d=new Date(r.date+'T00:00'); p.push(isNaN(d)?r.date:`${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`); }
  if(r.tin) p.push(`${r.tin} 도착${r.tout?`, ${r.tout} 퇴장`:''}`);
  if(r.people) p.push(`총 ${r.people}명`);
  if(r.vehicle) p.push(r.vehicle);
  const meals=[]; if(r.sadam1) meals.push(`사담 1부 ${r.sadam1}명`); if(r.sadam2) meals.push(`사담 2부 ${r.sadam2}명`); if(r.sadamD) meals.push(`사담 디너 ${r.sadamD}명`);
  if(r.mabangL) meals.push(`몽몽마방 점심 ${r.mabangL}명${r.mabangMenu?`(${r.mabangMenu})`:''}`); if(r.mabangD) meals.push(`몽몽마방 저녁 ${r.mabangD}명`);
  if(meals.length) p.push('식사는 '+meals.join(', ')); else if(r.meal) p.push('식사 '+r.meal);
  const prog=[]; if(r.chabang) prog.push('차방 해설'); if(r.donghaeng) prog.push('동행 해설'); if(r.dangdu) prog.push('당두 해설'); if(r.yoga) prog.push('요가·명상'); if(r.gaga) prog.push('가가 바우처'); if(r.teaMed) prog.push('티하우스 명상'); if(r.gayageum) prog.push('가야금'); if(r.cabin) prog.push('유루 캐빈');
  if(prog.length) p.push(prog.join(', ')+' 포함');
  if(r.pay) p.push(`결제는 ${r.pay}`);
  if(!p.length) return '내용이 채워지면 고객에게 읽어줄 확인 문구가 만들어집니다.';
  let s = `확인차 말씀드리겠습니다. ${r.org?r.org+', ':''}${p.join(', ')}. 이대로 예약 도와드리면 될까요?`;
  const cs=contactsOf(r);
  const mails=cs.map(c=>c.email).filter(Boolean), phones=cs.map(c=>c.phone).filter(Boolean);
  if(mails.length) s += ` 견적서는 ${mails.join(', ')}로 보내드리겠습니다.`;
  if(phones.length) s += ` 연락처는 ${phones.join(', ')} 맞으시죠?`;
  return s;
}

// ===================== 그날 예약 현황 (식사·프로그램) =====================
const INFO_OF = k => OPT[GROUP_OF[k]]?.id || null;   // sadam · mabang · prog
let curInfoKey = null;
const numOf = v => { const s=String(v||'').trim(); return /^\d+(\s*\+\s*\d+)*\s*명?$/.test(s) ? s.match(/\d+/g).reduce((a,x)=>a+(+x),0) : 0; };   // 인원만 더함 (10:30 같은 시간은 제외)
function sameDay(){ return cache.filter(r=>r.date===rec.date && r.id!==editingId); }
// 관리자 사이트(admin.sayuwon.com) 사담·마방 현황: Apps Script 가 15분마다 가져와 둔 것
const ADMIN_SLOT = { sadam1:['L1','사담 런치1부'], sadam2:['L2','사담 런치2부'], sadamD:['D','사담 디너'], mabangL:['MB','마방 사유의 밥상'] };
function adminLine(keys){
  const day = adminData && adminData.days && adminData.days[rec.date];
  const ks = keys.filter(k=>ADMIN_SLOT[k]);
  if(!ks.length) return '';
  if(!adminData) return '<div class="adm none">관리자 사이트 현황: 아직 가져오지 않음</div>';
  if(!day) return '<div class="adm none">관리자 사이트: 이 날짜 판매 정보 없음</div>';
  const parts = ks.map(k=>{ const [slot,name]=ADMIN_SLOT[k]; const s=day[slot]; if(!s) return '';
    const left = s.max!=null && s.cur!=null ? s.max-s.cur : null;
    return `<span class="${s.close||left===0?'full':''}">${name} <b>${s.cur??'-'}/${s.max??'-'}명</b>${s.teamMax?` · ${s.team??0}/${s.teamMax}팀`:''}${s.close?' · 마감':left!=null?` · 남은 ${left}명`:''}</span>`; }).filter(Boolean);
  return `<div class="adm">관리자 사이트 <small>(${fmtAgo(adminData.updated)})</small> · ${parts.join(' · ') || '<span class="none">해당 상품 없음</span>'}</div>`;
}
const fmtAgo = s => { if(!s) return ''; const m=Math.round((Date.now()-new Date(s))/60000); return m<1?'방금':m<60?`${m}분 전`:`${Math.round(m/60)}시간 전`; };
function renderInfo(k){
  curInfoKey = k || null;
  document.querySelectorAll('#form .f.hot').forEach(w=>w.classList.remove('hot'));
  if(k) document.getElementById('w_'+k)?.classList.add('hot');
  Object.values(OPT).map(o=>o.id).forEach(box=>{
    const el=document.getElementById('info_'+box); if(!el) return;
    if(!rec.date){ el.innerHTML='<span class="none">방문일을 넣으면 그날 예약 현황이 여기에 보입니다.</span>'; return; }
    const day=sameDay(); const keys=FIELDS.filter(f=>INFO_OF(f[1])===box && f[1]!=='mabangMenu').map(f=>f[1]);
    if(k && INFO_OF(k)===box && k!=='mabangMenu'){
      const hits=day.filter(r=>r[k]);
      const tot=hits.reduce((s,r)=>s+numOf(r[k]),0);
      el.innerHTML = `<b>${dateLabel(rec.date)} ${LABEL[k]}</b> · ${hits.length? `이미 ${hits.length}건${tot?`, ${tot}명`:''}` : '<span class="none">다른 예약 없음</span>'}`
        + (hits.length? `<ul>${hits.map(r=>`<li>${esc(r.org||r.contact||'(업체 미정)')} · ${esc(r[k])}${/^\d+$/.test(r[k])?'명':''}${r.owner?` · ${esc(r.owner)}`:''}</li>`).join('')}</ul>` : '')
        + adminLine([k]);
    } else {
      const parts=keys.map(key=>{ const hits=day.filter(r=>r[key]); if(!hits.length) return ''; const tot=hits.reduce((s,r)=>s+numOf(r[key]),0); return `${LABEL[key]} ${hits.length}건${tot?`(${tot}명)`:''}`; }).filter(Boolean);
      el.innerHTML = `<b>${dateLabel(rec.date)} ${Object.values(OPT).find(o=>o.id===box).title} 예약 현황</b> · ` + (parts.length? esc(parts.join(' · ')) : '<span class="none">다른 예약 없음</span>') + ' <span class="none">(칸에 커서를 두면 업체별로 보입니다)</span>' + adminLine(keys);
    }
  });
}

// 다시 확인할 것: 입력된 값끼리 맞지 않거나, 관리자 사이트 기준 자리가 모자랄 때
function fieldWarnings(r){
  const w=[];
  if(r.date){ const d=new Date(r.date+'T00:00'), t=new Date(); t.setHours(0,0,0,0); if(d<t) w.push({field:'date', reason:'지난 날짜입니다. 방문일을 다시 확인하세요.'}); }
  if(r.tin && r.tout && r.tout<=r.tin) w.push({field:'tout', reason:'퇴장 시간이 입장보다 빠릅니다. 오전/오후를 확인하세요.'});
  const day = adminData && adminData.days && adminData.days[r.date];
  if(day) Object.entries(ADMIN_SLOT).forEach(([k,[slot,name]])=>{
    const s=day[slot], want=numOf(r[k]); if(!s || !want) return;
    const left = s.max!=null && s.cur!=null ? s.max-s.cur : null;
    if(s.close) w.push({field:k, reason:`관리자 사이트에서 ${name}이(가) 마감입니다. 다른 시간을 안내하세요.`});
    else if(left!=null && want>left) w.push({field:k, reason:`${name} 남은 자리는 ${left}명인데 ${want}명입니다.`});
  });
  return w;
}

// ===================== 저장: 구글 시트(Apps Script) → 주소가 비어 있으면 이 브라우저 =====================
// SHARED_URL: group-intake.gs 를 웹 앱으로 배포한 주소 (README 참고). 비밀번호는 코드에 넣지 않고 각자 브라우저에 기억
const SHARED_URL = "https://script.google.com/macros/s/AKfycbwVW9NxrEhRDNRS-wmuXkgB1fOpt473vxCJpdksCfCmqV91eWnPhNmNgklmXaPc2GHi/exec";
const LKEY='sayuwon_intake_v1', KEY_LS='sayuwon_intake_key', PEND_LS='sayuwon_intake_pending', CACHE_LS='sayuwon_intake_cache';
const readJSON=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(_){ return d; } };
const writeJSON=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} };
let pending = readJSON(PEND_LS,[]);        // 아직 시트에 못 올린 저장·삭제 [{action:'put',item}|{action:'del',id}]
let serverItems = readJSON(CACHE_LS,[]);   // 마지막으로 받은 시트 내용 (바로 띄우기용)
const ADMIN_LS='sayuwon_intake_admin';
let adminData = readJSON(ADMIN_LS,null);   // 관리자 사이트 사담·마방 현황 {updated, days:{날짜:{L1,L2,D,MB}}}
let syncState = SHARED_URL ? 'loading' : 'off', flushing=false, retryTimer=null;
const getKey=()=>{ try{ return localStorage.getItem(KEY_LS)||''; }catch(_){ return ''; } };

async function callApi(body){
  // Content-Type 을 붙이지 않아야 Apps Script 로 사전 확인 요청 없이 바로 간다
  const r=await fetch(SHARED_URL,{method:'POST',body:JSON.stringify({...body,key:getKey()})});
  const j=await r.json();
  if(!j.ok){ const e=new Error(j.error||'error'); e.code=j.error; throw e; }
  return j;
}
function merged(){
  const m=new Map(serverItems.map(x=>[x.id,x]));
  pending.forEach(p=>{ if(p.action==='put') m.set(p.item.id,{...p.item,_pending:true}); else m.delete(p.id); });
  return [...m.values()];
}
function paintSync(){
  const chip=$('#syncChip'), n=pending.length;
  const txt={ off:'이 브라우저에만 저장', loading:'공유 기록 불러오는 중…', ok: n?`올리는 중 ${n}건`:'공유 기록 연결됨', error: n?`연결 안 됨 · ${n}건 대기`:'연결 안 됨 · 다시 시도 중', needkey:'비밀번호 필요' }[syncState];
  chip.textContent=txt; chip.className='sync '+(syncState==='ok'&&!n?'ok':(syncState==='error'||syncState==='needkey')?'warn':'');
  $('#storeHint').textContent = !SHARED_URL ? '이 브라우저에만 저장됩니다 (공유 주소 연결 전)' : syncState==='ok' ? '구글 시트에 저장 · 모두가 같은 목록을 봅니다' : syncState==='needkey' ? '팀 비밀번호를 넣으면 공유 목록이 보입니다' : syncState==='error' ? '연결이 안 돼 이 브라우저에 모아 두었다가 다시 올립니다' : '불러오는 중…';
  $('#keyForm').hidden = syncState!=='needkey';
}
function handleErr(e){
  if(e.code==='bad_key'){ syncState='needkey'; if(getKey()) $('#keyMsg').textContent='비밀번호가 맞지 않습니다.'; }
  else { syncState='error'; clearTimeout(retryTimer); retryTimer=setTimeout(()=>{ flush(); }, 15000); }
  paintSync();
}
async function flush(){
  if(!SHARED_URL || flushing) return;
  if(!getKey()){ syncState='needkey'; paintSync(); return; }
  flushing=true;
  try{
    while(pending.length){
      await callApi(pending[0]);
      pending.shift(); writeJSON(PEND_LS,pending); paintSync();
    }
    await pull(true);
  }catch(e){ handleErr(e); }
  finally{ flushing=false; }
}
async function pull(inFlush){
  if(!SHARED_URL) return;
  if(!getKey()){ syncState='needkey'; paintSync(); return; }
  if(flushing && !inFlush) return;
  try{
    const j=await callApi({action:'list'});
    serverItems=j.items||[]; writeJSON(CACHE_LS,serverItems.slice(-1000));
    if(j.admin!==undefined){ adminData=j.admin; writeJSON(ADMIN_LS,adminData); }
    syncState='ok'; $('#keyMsg').textContent=''; paintSync(); renderList();
  }catch(e){ if(inFlush) throw e; handleErr(e); }
}
const store={
  async list(){ cache = SHARED_URL ? merged() : readJSON(LKEY,[]); return cache; },
  async put(item){
    if(!SHARED_URL){ const l=readJSON(LKEY,[]); const i=l.findIndex(x=>x.id===item.id); if(i>=0) l[i]=item; else l.push(item); writeJSON(LKEY,l); return; }
    pending=pending.filter(p=>!(p.action==='put'&&p.item.id===item.id)); pending.push({action:'put',item}); writeJSON(PEND_LS,pending); paintSync(); flush();
  },
  async del(id){
    if(!SHARED_URL){ writeJSON(LKEY,readJSON(LKEY,[]).filter(x=>x.id!==id)); return; }
    const local=pending.some(p=>p.action==='put'&&p.item.id===id) && !serverItems.some(x=>x.id===id);
    pending=pending.filter(p=>!(p.action==='put'&&p.item.id===id));
    if(!local) pending.push({action:'del',id});
    writeJSON(PEND_LS,pending); paintSync(); flush();
  }
};

  const item={...rec, ...j, callType:'단체예약', summary:autoSummary(), note:$('#memoBox').value, takenBy:rec.owner,

}

  document.querySelectorAll('#listBody tr.r').forEach(tr=>tr.onclick=async e=>{

    const r=cache.find(x=>x.id===tr.dataset.id); if(!r) return;

    renderContacts(); renderForm(); closeList(); window.scrollTo({top:0,behavior:'smooth'});
  });
  renderInfo(curInfoKey);
}

// ===================== 칸별 한글/영어 입력 (견적서 사이트 방식) =====================
// data-ime="ko" (단체명·담당자 성함·영업 담당): 칸에 들어가면 항상 한글부터. 컴퓨터 입력기가 영문이어도 두벌식으로 조합.
//   한/영 키 · Shift+Space · 위쪽 한/A 버튼으로 영어 ↔ 한글
// data-ime="en" (이메일): 항상 영어. 입력기가 한글이어도 누른 자판 글자로 바꿔 넣음
(function(){
  let on = true;
  const MAP = { q:"ㅂ", w:"ㅈ", e:"ㄷ", r:"ㄱ", t:"ㅅ", y:"ㅛ", u:"ㅕ", i:"ㅑ", o:"ㅐ", p:"ㅔ",
                a:"ㅁ", s:"ㄴ", d:"ㅇ", f:"ㄹ", g:"ㅎ", h:"ㅗ", j:"ㅓ", k:"ㅏ", l:"ㅣ",
                z:"ㅋ", x:"ㅌ", c:"ㅊ", v:"ㅍ", b:"ㅠ", n:"ㅜ", m:"ㅡ",
                Q:"ㅃ", W:"ㅉ", E:"ㄸ", R:"ㄲ", T:"ㅆ", O:"ㅒ", P:"ㅖ" };
  const REV = {}; Object.keys(MAP).forEach(k=>{ if(!REV[MAP[k]] || k===k.toLowerCase()) REV[MAP[k]]=k; });
  Object.assign(REV,{ "ㅃ":"Q","ㅉ":"W","ㄸ":"E","ㄲ":"R","ㅆ":"T","ㅒ":"O","ㅖ":"P" });
  const btn = document.getElementById('ko-toggle');
  const mode = el => el && el.dataset ? el.dataset.ime : '';
  function paintBtn(){ btn.textContent = on ? '한' : 'A'; btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on?'true':'false');
    btn.title = on ? '한글 입력 중 (단체명·담당자 성함) · 한/영 키나 Shift+Space로 영어' : '영어 입력 중 · 한/영 키나 Shift+Space로 한글'; }
  function setOn(v){ on=v; comp=null; enQ=[]; paintBtn(); }
  btn.addEventListener('click', ()=>{ setOn(!on); const a=document.activeElement; if(mode(a)==='ko') a.focus(); });
  paintBtn();
  const effOn = el => mode(el)==='ko' ? on : false;   // 이메일은 늘 영어
  function isHanYoung(e){ return e.key==='HangulMode' || e.code==='Lang1' || e.keyCode===21; }
  function put(el,start,end,text){ const v=el.value; el.value=v.slice(0,start)+text+v.slice(end); const c=start+text.length; el.setSelectionRange(c,c); el.dispatchEvent(new Event('input',{bubbles:true})); return c; }
  // 남은 한글을 자판 글자로 (이메일 안전장치)
  const toKeys = s => window.Hangul ? Hangul.disassemble(s).map(j=>REV[j]||j).join('') : s;

  let comp=null, enQ=[], enEl=null, enStart=null, osKo=null;
  document.addEventListener('focusin', e=>{ comp=null; if(mode(e.target)==='ko') setOn(true); });   // 단체명·성함은 들어갈 때마다 한글부터
  document.addEventListener('mousedown', ()=>{ comp=null; });
  document.addEventListener('keydown', e=>{
    const ime = e.isComposing || e.key==='Process' || e.keyCode===229;
    const el = e.target, m = mode(el);
    if(isHanYoung(e) || (ime && (e.code==='Lang1' || e.code==='AltRight'))){ if(m!=='en') setOn(!on); if(osKo!==null) osKo=!osKo; return; }
    if(m!=='ko' && m!=='en') return;
    if(m==='ko' && e.key===' ' && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey){ e.preventDefault(); setOn(!on); return; }
    if(e.ctrlKey || e.altKey || e.metaKey){ comp=null; return; }
    if(/^Key[A-Z]$/.test(e.code)){ if(m==='ko' && osKo!==null && ime!==osKo) setOn(!on); osKo=ime; }
    if(!effOn(el)){   // 영어인데 입력기가 한글: 누른 자판을 기억하고 조합을 바로 끝냄
      if(ime && /^Key[A-Z]$/.test(e.code)){
        const ch=e.code.slice(3), upper = e.shiftKey !== (e.getModifierState && e.getModifierState('CapsLock'));
        enQ.push(upper?ch:ch.toLowerCase()); enEl=el;
        setTimeout(()=>{ if(document.activeElement===el){ el.blur(); el.focus(); } },0);
      }
      return;
    }
    if(!window.Hangul || ime){ if(e.key!=='Shift') comp=null; return; }   // 한글 + 입력기 한글: 그대로
    const live = comp && comp.el===el && el.selectionStart===comp.end && el.selectionEnd===comp.end;
    if(/^[a-zA-Z]$/.test(e.key)){
      const j=(e.shiftKey && MAP[e.key.toUpperCase()]) || MAP[e.key.toLowerCase()];
      e.preventDefault();
      if(!live) comp={el, start:el.selectionStart, end:el.selectionEnd, jamo:[]};
      comp.jamo.push(j);
      const text=Hangul.assemble(comp.jamo);
      comp.end=put(el,comp.start,comp.end,text);
      if(text.length>2){ const n=text.length-2; comp.start+=n; comp.jamo=Hangul.disassemble(text.slice(n)); }
      return;
    }
    if(e.key==='Backspace' && live && comp.jamo.length){ e.preventDefault(); comp.jamo.pop(); comp.end=put(el,comp.start,comp.end,Hangul.assemble(comp.jamo)); if(!comp.jamo.length) comp=null; return; }
    if(e.key!=='Shift') comp=null;
  }, true);
  document.addEventListener('compositionstart', e=>{ if(!effOn(e.target) && mode(e.target)) enStart=e.target.selectionStart; }, true);
  document.addEventListener('compositionend', e=>{
    const el=e.target; if(effOn(el) || !mode(el)) return;
    const data=e.data||'', start=enStart;
    if(el===enEl && enQ.length){
      const n = window.Hangul ? Hangul.disassemble(data).length : data.length;
      const letters = enQ.splice(0, n||enQ.length).join('');
      setTimeout(()=>{ if(start==null || el.value.slice(start,start+data.length)!==data) return; put(el,start,start+data.length,letters); },0);
    } else if(mode(el)==='en'){
      setTimeout(()=>{ if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(el.value)){ const c=el.selectionStart; el.value=toKeys(el.value); el.setSelectionRange(c,c); el.dispatchEvent(new Event('input',{bubbles:true})); } },0);
    }
  }, true);
  // 이메일: 붙여넣기 등으로 한글이 들어오면 자판 글자로
  document.addEventListener('input', e=>{ const el=e.target; if(mode(el)==='en' && !e.isComposing && /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(el.value)){ el.value=toKeys(el.value); el.dispatchEvent(new Event('input',{bubbles:true})); } }, true);
})();
</script>
