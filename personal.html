<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인고객 전화응대 · 사유원 예약 관리 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem("sy_user")||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/personal.css?v=20261114">
<link rel="stylesheet" href="css/mypop.css?v=20261114">
</head>
<body data-my-tab="personal">
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 예약 관리 시스템</a><span class="sys-crumb">개인고객 전화응대</span>
  <span class="sync warn" id="syncChip" hidden></span>
  <button type="button" class="ko-toggle on" id="ko-toggle" aria-pressed="true">한</button>
  <span class="me" id="me" title="로그인한 사람 (통화를 받은 사람)"></span>
  <button type="button" class="list-btn" id="myOpenBtn" data-mypop title="내 개인고객 통화 · 단체 예약의 추후 과업을 한눈에 (팝업)">마이페이지 <span class="tag call" id="myCount" hidden></span></button>
  <span class="hd-gap"></span>
  <a class="hb" id="manualOpen" href="#" target="_blank" rel="noopener" title="노션 전화문의 응대 매뉴얼 (새 창)">전화문의 응대 매뉴얼 ↗</a>
  <button type="button" class="hb" id="allCallsBtn" title="저장된 개인고객 통화 기록 전체 (검색 · 열기)">통화 기록 전체</button>
</header>

<main>
  <!-- 왼쪽: 통화 기록 -->
  <div class="col">
    <form class="panel" id="callForm" autocomplete="off">
      <h2>통화 기록 <small id="startedAt"></small><span class="h-btns"><button class="btn" type="button" id="copyBtn" title="카카오톡 보고용 글자 복사">보고 글자 복사</button><button class="btn primary" type="submit" id="saveBtn">저장 (Ctrl+S)</button><button class="btn" type="button" id="newBtn">＋ 새 통화</button></span></h2>
      <div class="editing" id="editing" hidden></div>
      <div class="sub-h" style="margin-top:0">구분 · 보고</div>
      <div class="row">
        <div class="f w4"><label>구분</label><div class="chips" id="catChips" role="group" aria-label="구분"></div></div>
        <div class="f" style="grid-column:span 3"><label>보고전달자 <small>(선택 · 다시 누르면 해제)</small></label><div class="chips" id="rtChips" role="group" aria-label="보고전달자"></div></div>
        <div class="f"><label>예약 여부</label><div class="chips" id="resChips" role="group" aria-label="예약 여부"></div></div>
      </div>
      <div class="sub-h">고객 · 방문</div>
      <div class="row">
        <div class="f"><label for="fName">고객 이름</label><input id="fName" lang="ko" data-ime="ko" autocomplete="off" placeholder="예) 홍길동"></div>
        <div class="f"><label for="fPhone">연락처</label><input id="fPhone" inputmode="tel" placeholder="010-0000-0000"></div>
        <div class="f"><label for="fDate">방문 희망일 / 예약일</label><input id="fDate" type="date"></div>
        <div class="f"><label for="fPeople">인원</label><input id="fPeople" inputmode="numeric" placeholder="명"></div>
      </div>
      <div class="sub-h">문의 내용</div>
      <div class="f w4"><textarea id="fNote" lang="ko" placeholder="예) 11/27 금요일 2명 사담 런치 1부 가능한지 · 주차 문의"></textarea></div>
      <div class="btns">
        <span class="state" id="state"></span>
      </div>
      <p class="hint" style="margin-top:10px">저장하면 팀 공유 기록(구글 시트)에 '개인고객'으로 남습니다.</p>
    </form>
  </div>

  <!-- 오른쪽: 이 통화의 추후 과업 (단체 화면처럼 2열) -->
  <div class="col">
    <section class="panel">
      <h2>추후 과업 <small>체크리스트 · 과업마다 메모</small></h2>
      <form class="task-add" id="taskAdd"><input id="taskAddIn" lang="ko" data-ime="ko" placeholder="과업 직접 추가 (예: 사담 자리 확인 후 연락)" autocomplete="off"><button class="btn" type="submit">추가</button></form>
      <ul class="tasks" id="taskList"></ul>
      <p class="hint" id="taskHint" style="margin-top:8px"></p>
    </section>
  </div>
</main>

<!-- 팀 비밀번호 (공유 기록 연결) -->
<div class="modal" id="keyModal" hidden>
  <form class="panel" id="keyForm">
    <h2>공유 기록 연결</h2>
    <p class="hint">팀 비밀번호를 넣어 주세요. 이 브라우저에 기억됩니다 (단체 화면과 같은 비밀번호).</p>
    <div class="f" style="margin-top:10px"><input id="keyInput" type="password" placeholder="팀 비밀번호" autocomplete="off"></div>
    <p class="hint" id="keyMsg" style="color:var(--red);min-height:18px"></p>
    <div class="btns" style="justify-content:flex-end;margin-top:6px"><button class="btn primary" type="submit">연결</button></div>
  </form>
</div>
<!-- 개인고객 통화 기록 전체 (모든 직원이 받은 통화 · 검색 · 누르면 열기) -->
<div class="modal" id="allModal" hidden>
  <section class="panel wide" role="dialog" aria-modal="true" aria-labelledby="allTitle">
    <h2 id="allTitle"><span id="allName">개인고객 통화 기록 전체</span> <small id="allCount"></small><button type="button" class="btn" id="allTrash" style="margin-left:auto;padding:4px 12px" title="삭제한 개인고객 통화 (삭제 일시 · 삭제한 사람 · 사유)">삭제된 통화</button><button type="button" class="btn" id="allClose" style="padding:4px 12px">닫기</button></h2>
    <input class="search" id="allSearch" type="search" lang="ko" placeholder="검색: 이름 · 연락처 · 문의 내용 · 받은 사람 · 과업">
    <div class="all-tw"><table class="all-t"><thead id="allHead"><tr><th>저장</th><th>고객</th><th>연락처</th><th>방문 희망일 / 예약일</th><th>인원</th><th>문의 내용</th><th>남은 과업</th><th></th><th class="owner">받은 사람</th></tr></thead><tbody id="allBody"></tbody></table></div>
  </section>
</div>
<!-- 통화 기록 삭제 (사유 필수) -->
<div class="modal" id="pdelModal" hidden>
  <section class="panel del-box" role="dialog" aria-modal="true" aria-labelledby="pdelTitle">
    <h2 id="pdelTitle">통화 기록 삭제 <small id="pdelWho"></small></h2>
    <label for="pdelReason" style="font-size:13px;font-weight:700">삭제 사유 (필수)</label>
    <select id="pdelReason"></select>
    <input id="pdelWhy" lang="ko" placeholder="자세한 사유 (선택 · 기타면 필수)" autocomplete="off">
    <div class="row-btns" style="margin-top:12px;justify-content:flex-end;display:flex;gap:6px"><button type="button" class="btn" id="pdelCancel">취소</button><button type="button" class="btn danger" id="pdelOk">삭제</button></div>
  </section>
</div>
<!-- 마감이 된 추후 과업 알림 (오전 8시 · 11시 · 오후 1시 · 5시, 단체 화면과 같은 기록이라 한 시각에 한 번) -->
<div class="modal" id="dueModal" hidden>
  <section class="panel wide" role="dialog" aria-modal="true" aria-labelledby="dueTitle">
    <h2 id="dueTitle">마감이 된 추후 과업</h2>
    <ul class="due-list" id="dueList"></ul>
    <div class="btns" style="justify-content:flex-end"><button class="btn" id="dueClose" title="다음 알림 시각(8 · 11 · 13 · 17시)에 다시">닫기</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="js/personal.js?v=20261114"></script>
<!-- 마이페이지 팝업 (메뉴 7번 페이지 group.html?my=1 을 그대로 띄움) -->
<div class="mypop" id="myPop" hidden><div class="box"><iframe id="myPopFrame" title="마이페이지"></iframe></div></div>
<script src="js/mypop.js?v=20261114"></script>
<script src="https://cdn.jsdelivr.net/npm/hangul-js@0.2.6/hangul.min.js"></script>
<script src="js/ime.js?v=20261114"></script>
</body>
</html>
