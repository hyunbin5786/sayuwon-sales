<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인고객 전화응대 · 사유원 예약 관리 시스템</title>
<script>/* 로그인(이름 + 사번)을 안 했으면 첫 화면으로 */ (function(){ try{ var u=JSON.parse(localStorage.getItem("sy_user")||"null"); if(!u || !u.name || !u.emp) location.replace("./"); }catch(e){} })();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 개인고객 전화응대: 왼쪽 통화 기록 · 오른쪽 다시 연락할 통화 · 최근 통화 · 가격 · 사담 현황
   저장은 단체 화면과 같은 공유 기록(구글 시트 calls 시트, 통화 구분 '개인고객'). 단체 목록에는 나오지 않음 */
:root{
  --bg:#f3f1ec; --card:#fffefb; --ink:#262620; --muted:#77736a; --line:#dfdace;
  --pine:#3f5236; --pine-soft:#e4eadf; --amber:#b0742a; --amber-soft:#f8ecd9; --red:#a4442c; --red-soft:#f6e1da;
  --serif:"Noto Serif KR",serif; --sans:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans)}
header{background:var(--pine);color:#f3f1ec;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font:600 17px var(--serif)}
header .sys-brand{color:#f3f1ec;text-decoration:none;font:600 18px var(--serif);letter-spacing:.02em;white-space:nowrap}
header .sys-brand:hover{text-decoration:underline;text-underline-offset:4px}
header .sys-crumb{font:600 15px var(--sans);color:#f3f1ec;white-space:nowrap}
header .sys-crumb::before{content:"›";margin:0 10px 0 2px;opacity:.55;font-weight:400}
header .sys-crumb[hidden]{display:none}   /* 공통 헤더: 시스템 이름(누르면 메뉴) › 화면 이름 */
header .hb{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#f3f1ec;border-radius:7px;padding:4px 12px;font:700 13px var(--sans);cursor:pointer;text-decoration:none}
header .hb:hover{background:rgba(255,255,255,.2)}
header .me{margin-left:auto;font-size:13px}
header .sync{font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
header .sync.warn{background:#f3d9b5;color:#6b4513}
header .sync[hidden]{display:none}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px max(16px,env(safe-area-inset-left,0px));max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{margin:0 0 10px;font:600 16px var(--serif);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font:400 12px var(--sans);color:var(--muted)}
.panel h2 .h-btns{margin-left:auto;display:flex;gap:6px}   /* 제목 줄 오른쪽 위: 저장 · 새 통화 */
.panel h2 .h-btns .btn{font:700 13px var(--sans);padding:6px 12px}
.panel h2 .h-btns .btn:not(.primary){font-weight:500}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
@media (max-width:560px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 9px;font:14px var(--sans);background:#fff;color:var(--ink)}
.f textarea{height:150px;padding:8px 10px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--pine)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font:500 13px var(--sans);cursor:pointer}
.chips button.on{background:var(--pine);border-color:var(--pine);color:#fff}
.sub-h{font-size:12px;color:var(--muted);margin:12px 0 5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:8px 14px;font:500 13px var(--sans);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:700}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:0}
.state{font-size:12.5px;color:var(--muted)}
.editing{background:var(--amber-soft);border-radius:7px;padding:6px 10px;font-size:12.5px;margin-bottom:10px}
.editing[hidden]{display:none}
.group-tip{background:var(--pine-soft);border-radius:7px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.group-tip[hidden]{display:none}
/* 문의 매뉴얼 (노션) */
.manual{position:sticky;top:64px;display:flex;flex-direction:column;height:calc(100vh - 80px);min-height:420px}
.manual iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:0}
@media (max-width:900px){.manual{position:static;height:70vh}}
/* 날짜 칸: 단체 방문일과 같은 방식 (칸 안에 날짜 (요일) · 누르면 달력) */.dbox{position:relative;display:block;min-width:0}.dbox .dtxt{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 9px;font:14px var(--sans);background:#fff;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}.dbox .dtxt:not([readonly]){cursor:text}.dbox .dtxt:focus{outline:none;border-color:var(--pine)}.dbox input.dpick{position:absolute;left:0;bottom:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none;border:0;padding:0}.tadd .dbox{flex:0 0 150px}.tasks li .dbox{flex:0 0 140px}.tasks li .dbox .dtxt{height:28px;font-size:12.5px;padding:0 6px}
/* 추후 과업: 단체 화면과 같은 모양 · 동작 (체크 · 끌어서 순서 · ▲▼ · 마감일 · 세부 과제 · 메모 · 끝난 과업은 한 줄로) */
.task-add{display:flex;gap:6px;margin:0 0 10px;position:sticky;top:56px;z-index:3;background:var(--card);padding:6px 0;box-shadow:0 6px 6px -6px rgba(0,0,0,.08)}
.task-add input{flex:1;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font:13px var(--sans)}
.task-add input:focus{outline:none;border-color:var(--pine)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.task.done{background:#f1f1ee;border-color:#e2e2dc;color:#9a9a92}
.task.collapsed{padding:6px 12px}
.task.collapsed > :not(.task-h){display:none}
.task.late{background:#fdf0ee;border-color:#e0a399}
.task-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.task-c{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.task-c input{width:17px;height:17px;accent-color:var(--pine);flex:none}
.task.done .task-c span{text-decoration:line-through;color:#9a9a92}
.task.late .task-c span{color:var(--red)}
.texp{border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:0 4px;white-space:nowrap}
.texp:hover{color:var(--pine)}
.tdrag{flex:none;cursor:grab;color:var(--muted);font-size:14px;line-height:1;padding:2px 2px 2px 0;user-select:none}
.tdrag:hover{color:var(--pine)}
.task.dragging{opacity:.45}
.task.drop-before{box-shadow:0 -3px 0 var(--pine)}
.task.drop-after{box-shadow:0 3px 0 var(--pine)}
.tmove{display:flex;flex:none;gap:2px}
.tmove button{width:22px;height:22px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-size:9px;cursor:pointer;padding:0}
.tmove button:hover{border-color:var(--pine);color:var(--pine)}
.tdue{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:400;color:var(--muted);flex:none;white-space:nowrap}
.tdue .dbox{flex:0 0 128px}
.tdue .dbox .dtxt{height:26px;font-size:12px;padding:0 5px;border-radius:5px}
.task.late .tdue{color:var(--red);font-weight:700}
.task.late .tdue .dtxt{border-color:var(--red);color:var(--red);font-weight:700}
.task.done .tdue .dtxt{color:#9a9a92;background:transparent}
.task-h .del{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.task-h .del:hover{color:var(--red)}
.task textarea{width:100%;margin-top:8px;min-height:38px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px/1.5 var(--sans)}
.task textarea:focus{outline:none;border-color:var(--pine)}
.tsubs{display:flex;flex-direction:column;gap:3px;margin:6px 0 0 25px}
.tsub{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;cursor:pointer}
.tsub input{width:15px;height:15px;margin:0;accent-color:var(--pine)}
.tsub.on{color:#9a9a92;text-decoration:line-through}
.tsub-row{display:flex;align-items:center;gap:4px}
.tsub-del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px}
.tsub-del:hover{color:var(--red)}
.tsub-add{display:flex;gap:4px;margin-top:2px}
.tsub-add input{flex:1;height:28px;border:1px dashed var(--line);border-radius:5px;padding:0 8px;font:12.5px var(--sans);background:#fff}
.tsub-add .btn{padding:2px 8px;font-size:12px}
.tasks .empty{list-style:none;color:var(--muted);font-size:12.5px}
/* 목록 */
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.list li:first-child{border-top:0}
.list li:hover{background:#faf8f2}
.list li b{font-size:13.5px}
.list li .meta{font-size:12px;color:var(--muted)}
.list li .r{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.list li .txt{grid-column:1/-1;font-size:12.5px;color:#55524a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;background:#ece9e2;color:var(--muted);margin-right:4px}
.tag.cb{background:var(--amber-soft);color:var(--amber);font-weight:700}
.tag.late{background:var(--red-soft);color:var(--red);font-weight:700}
.tag.done{background:var(--pine-soft);color:var(--pine)}
.search{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font:13px var(--sans);margin-bottom:6px}
.empty{color:var(--muted);font-size:12.5px;padding:6px 2px}
/* 가격 · 현황 */
table.pt{width:100%;border-collapse:collapse;font-size:12.5px}
table.pt th,table.pt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.pt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.pt th{color:var(--muted);font-weight:500;font-size:11.5px}
.seat{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.seat span{border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12.5px;background:#fff}
.seat span.full{color:var(--red);border-color:var(--red)}
/* 팀 비밀번호 */
.modal .panel.wide{width:min(1200px,100%);max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.all-tw{overflow:auto;min-height:0;flex:1;margin-top:4px}
.all-t{width:100%;border-collapse:collapse;font-size:13px}
.all-t th,.all-t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.all-t th{font-size:12px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--card)}
.all-t td{white-space:nowrap}
.all-t td.note{white-space:normal;min-width:220px;color:#55524a}
.all-t tbody tr{cursor:pointer}
.all-t tbody tr:hover td{background:#faf8f2}
.due-list{list-style:none;margin:0;padding:0;overflow:auto}
.due-list li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 2px}
.due-list li .who{flex:1;min-width:0;font-size:13px}
.due-list li.late b.t{color:var(--red)}
.due-list .btn{padding:4px 10px;font-size:12px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(30,30,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:80px 16px}
.modal[hidden]{display:none}
.modal .panel{width:min(420px,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2f2f29;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <a class="sys-brand" href="./" title="메뉴로">사유원 예약 관리 시스템</a><span class="sys-crumb">개인고객 전화응대</span>
  <span class="sync warn" id="syncChip" hidden></span>
  <span class="me" id="me"></span>
  <a class="hb" id="manualOpen" href="#" target="_blank" rel="noopener" title="노션 전화문의 응대 매뉴얼 (새 창)">전화문의 응대 매뉴얼 ↗</a>
  <button type="button" class="hb" id="allCallsBtn" title="저장된 개인고객 통화 기록 전체 (검색 · 열기)">통화 기록 전체</button>
  <a class="hb" href="mypage.html" data-mypop title="단체 예약 · 개인고객 통화의 추후 과업을 한눈에 (팝업)">마이페이지</a>
</header>

<main>
  <!-- 왼쪽: 통화 기록 -->
  <div class="col">
    <form class="panel" id="callForm" autocomplete="off">
      <h2>통화 기록 <small id="startedAt"></small><span class="h-btns"><button class="btn primary" type="submit" id="saveBtn">저장 (Ctrl+S)</button><button class="btn" type="button" id="newBtn">＋ 새 통화</button></span></h2>
      <div class="editing" id="editing" hidden></div>
      <div class="sub-h" style="margin-top:0">고객 · 방문</div>
      <div class="row">
        <div class="f"><label for="fName">고객 이름</label><input id="fName" lang="ko" placeholder="예) 홍길동"></div>
        <div class="f"><label for="fPhone">연락처</label><input id="fPhone" inputmode="tel" placeholder="010-0000-0000"></div>
        <div class="f"><label for="fDate">방문 희망일 / 예약일</label><input id="fDate" type="date"></div>
        <div class="f"><label for="fPeople">인원</label><input id="fPeople" inputmode="numeric" placeholder="명"></div>
      </div>
      <div class="sub-h">문의 내용</div>
      <div class="f w4"><textarea id="fNote" lang="ko" placeholder="예) 11/27 금요일 2명 사담 런치 1부 가능한지 · 주차 문의"></textarea></div>
      <div class="btns">
        <button class="btn danger" type="button" id="delBtn" hidden>삭제</button>
        <span class="state" id="state"></span>
      </div>
      <p class="hint" style="margin-top:10px">저장하면 팀 공유 기록(구글 시트)에 '개인고객'으로 남습니다.</p>
    </form>
  </div>

  <!-- 오른쪽: 이 통화의 추후 과업 (단체 화면처럼 2열) -->
  <div class="col">
    <section class="panel">
      <h2>추후 과업 <small>체크리스트 · 과업마다 메모</small></h2>
      <form class="task-add" id="taskAdd"><input id="taskAddIn" lang="ko" placeholder="과업 직접 추가 (예: 사담 자리 확인 후 연락)" autocomplete="off"><button class="btn" type="submit">추가</button></form>
      <ul class="tasks" id="taskList"></ul>
      <p class="hint" id="taskHint" style="margin-top:8px"></p>
    </section>
  </div>
</main>

<!-- 팀 비밀번호 (공유 기록 연결) -->
<div class="modal" id="keyModal" hidden>
  <form class="panel" id="keyForm">
    <h2>공유 기록 연결</h2>
    <p class="hint">팀 비밀번호를 넣어 주세요. 이 브라우저에 기억됩니다 (단체 화면과 같은 비밀번호).</p>
    <div class="f" style="margin-top:10px"><input id="keyInput" type="password" placeholder="팀 비밀번호" autocomplete="off"></div>
    <p class="hint" id="keyMsg" style="color:var(--red);min-height:18px"></p>
    <div class="btns" style="justify-content:flex-end;margin-top:6px"><button class="btn primary" type="submit">연결</button></div>
  </form>
</div>
<!-- 개인고객 통화 기록 전체 (모든 직원이 받은 통화 · 검색 · 누르면 열기) -->
<div class="modal" id="allModal" hidden>
  <section class="panel wide" role="dialog" aria-modal="true" aria-labelledby="allTitle">
    <h2 id="allTitle">개인고객 통화 기록 전체 <small id="allCount"></small><button type="button" class="btn" id="allClose" style="margin-left:auto;padding:4px 12px">닫기</button></h2>
    <input class="search" id="allSearch" type="search" lang="ko" placeholder="검색: 이름 · 연락처 · 문의 내용 · 받은 사람 · 과업">
    <div class="all-tw"><table class="all-t"><thead><tr><th>저장</th><th>받은 사람</th><th>고객</th><th>연락처</th><th>방문 희망일 / 예약일</th><th>인원</th><th>문의 내용</th><th>남은 과업</th></tr></thead><tbody id="allBody"></tbody></table></div>
  </section>
</div>
<!-- 마감이 된 추후 과업 알림 (오전 8시 · 11시 · 오후 1시 · 5시, 단체 화면과 같은 기록이라 한 시각에 한 번) -->
<div class="modal" id="dueModal" hidden>
  <section class="panel wide" role="dialog" aria-modal="true" aria-labelledby="dueTitle">
    <h2 id="dueTitle">마감이 된 추후 과업</h2>
    <ul class="due-list" id="dueList"></ul>
    <div class="btns" style="justify-content:flex-end"><button class="btn" id="dueClose" title="다음 알림 시각(8 · 11 · 13 · 17시)에 다시">닫기</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readJSON=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(_){ return d; } };
const writeJSON=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} };
const DOW='일월화수목금토';
const dLabel = d => { const t=new Date(String(d).slice(0,10)+'T00:00'); return isNaN(t)?'':`${t.getMonth()+1}/${t.getDate()}(${DOW[t.getDay()]})`; };

async function flush(){
  if(flushing) return; if(!getKey()){ paintSync('needkey'); return; }

    while(pending.length){ await callApi(pending[0]); pending.shift(); writeJSON(PEND_LS,pending); paintSync(); }

}

// 원래 <input type="date"> 는 숨긴 달력으로 그대로 두어 값 · 이벤트(input · change)는 예전 그대로
const dateDisp = v => { if(!v) return ''; const t=new Date(v+'T00:00'); return isNaN(t) ? v : `${v} (${DOW[t.getDay()]})`; };
function parseDateText(s){
  s=String(s||'').replace(/\([^)]*\)\s*$/,'').trim(); if(!s) return '';
  let y, m, d, x;
  if((x=s.match(/^(\d{4})\s*[-./년 ]?\s*(\d{1,2})\s*[-./월 ]?\s*(\d{1,2})\s*일?$/))){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=s.match(/^(\d{1,2})\s*[-./월 ]\s*(\d{1,2})\s*일?$/)) || (x=s.match(/^(\d{2})(\d{2})$/))){
    m=+x[1]; d=+x[2]; const now=new Date(); y=now.getFullYear(); const t=new Date(y,m-1,d); now.setHours(0,0,0,0); if(t<now) y++; }   // 연도 없으면 올해 (이미 지났으면 내년)
  else return null;
  const t=new Date(y,m-1,d); if(t.getFullYear()!==y || t.getMonth()!==m-1 || t.getDate()!==d) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function makeDateBox(pick){
  if(!pick || pick.dataset.dbox) return; pick.dataset.dbox='1';
  const box=document.createElement('span'); box.className='dbox'; pick.parentNode.insertBefore(box, pick);
  const txt=document.createElement('input'); txt.className='dtxt'; txt.readOnly=true; txt.placeholder=pick.dataset.ph||'누르면 달력'; txt.title='누르면 달력 · 한 번 더 누르면 직접 입력 (예: 2026-12-05, 12/5)'; txt.setAttribute('inputmode','numeric');
  box.appendChild(txt); box.appendChild(pick); pick.classList.add('dpick'); pick.tabIndex=-1;
  const paint=()=>{ if(!txt.dataset.editing) txt.value=dateDisp(pick.value); };
  const set=v=>{ pick.value=v; pick.dispatchEvent(new Event('input',{bubbles:true})); pick.dispatchEvent(new Event('change',{bubbles:true})); paint(); };
  const openPick=()=>{ try{ pick.showPicker(); }catch(_){ pick.focus(); } };
  const startEdit=blank=>{ txt.dataset.editing='1'; txt.readOnly=false; txt.value = blank ? '' : pick.value; txt.focus(); if(!blank) txt.select(); };
  txt.addEventListener('mousedown', e=>{ if(txt.dataset.editing) return;
    if(Date.now()-(+txt.dataset.pickAt||0) < 20000){ e.preventDefault(); txt.dataset.pickAt=''; startEdit(false); return; }   // 두 번째 누름 = 직접 입력
    txt.dataset.pickAt=String(Date.now()); setTimeout(openPick,0); });
  txt.addEventListener('keydown', e=>{ if(!txt.dataset.editing && /^\d$/.test(e.key)) startEdit(true); else if(!txt.dataset.editing && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); openPick(); } else if(txt.dataset.editing && e.key==='Enter'){ e.preventDefault(); txt.blur(); } });
  txt.addEventListener('blur', ()=>{ if(!txt.dataset.editing) return; const d=parseDateText(txt.value);
    delete txt.dataset.editing; txt.readOnly=true;
    if(d===null){ toast('날짜를 알아볼 수 없습니다. 예) 2026-12-05, 12/5'); paint(); return; }
    if(d!==pick.value) set(d); else paint(); });
  pick.addEventListener('input', paint); pick.addEventListener('change', paint);
  pick.__paintBox = paint; paint();
}

// ===================== 추후 과업 (단체 화면과 같은 모양 · 동작) =====================
// 순서: 마감일이 빠른 순, 같으면 최근에 추가한 것이 위. 직접 옮긴 과업(ordSet)은 그 순서 그대로, 끝난 과업은 맨 아래 한 줄로(자세히 ▾)
// 세부 과제가 있으면 모두 체크될 때 완료. 이미 저장한 통화면 체크 · 순서 · 마감일 · 세부 과제 · 메모(칸을 벗어날 때)는 바로 저장
let openDone = new Set();   // 펼쳐 본 끝난 과업
function sortedTasks(){
  const byNew=(a,b)=>String(a.due||'').localeCompare(String(b.due||'')) || String(b.at||'').localeCompare(String(a.at||''));
  const open=form.tasks.filter(t=>!t.done), done=form.tasks.filter(t=>t.done).sort(byNew);
  const list=open.filter(t=>t.ordSet).sort((a,b)=>a.ord-b.ord);
  open.filter(t=>!t.ordSet).sort(byNew).forEach(t=>{ let i=list.findIndex(x=>x.ordSet && String(x.due||'')>=String(t.due||'')); if(i<0) i=list.length; list.splice(i,0,t); });
  return [...list, ...done];
}
function subsHTML(t){
  const rows=(t.xsubs||[]).map(x=>`<div class="tsub-row"><label class="tsub${x.done?' on':''}"><input type="checkbox" data-xsub="${esc(t.id)}|${esc(x.id)}"${x.done?' checked':''}> ${esc(x.title)}</label><button type="button" class="tsub-del" data-xdel="${esc(t.id)}|${esc(x.id)}" title="세부 과제 빼기">×</button></div>`);
  return `<div class="tsubs">${rows.join('')}<div class="tsub-add"><input data-xadd="${esc(t.id)}" lang="ko" placeholder="+ 세부 과제 추가 (적고 Enter)" autocomplete="off"><button type="button" class="btn" data-xaddbtn="${esc(t.id)}">추가</button></div></div>`;
}
function paintTasks(){
  const box=$('#taskList'), ae=document.activeElement;
  if(box.contains(ae) && (ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT' && ae.type!=='checkbox' && !ae.readOnly && !ae.classList.contains('dpick')))) return;   // 메모 · 세부 과제를 쓰는 중이면 다시 그리지 않음
  const today=todayYmd();
  box.innerHTML = sortedTasks().map(t=>{ const due=t.due||today, late=!t.done && due<today, fold=t.done && !openDone.has(t.id);
    return `<li class="task${t.done?' done':late?' late':''}${fold?' collapsed':''}" data-id="${esc(t.id)}">`
      + `<div class="task-h">${t.done?'':`<span class="tdrag" title="끌어서 순서 바꾸기">⠿</span>`}<label class="task-c"><input type="checkbox" data-tk="${esc(t.id)}"${t.done?' checked':''}><span>${esc(t.title)}</span></label>`
      + `${t.done?`<button type="button" class="texp" data-texp="${esc(t.id)}">${fold?'자세히 ▾':'접기 ▴'}</button>`:''}`
      + `${t.done?'':`<span class="tmove"><button type="button" data-tmv="${esc(t.id)}|-1" title="위로">▲</button><button type="button" data-tmv="${esc(t.id)}|1" title="아래로">▼</button></span>`}`
      + `<label class="tdue" title="마감일 · 바꿀 수 있음">${late?'기한 지남 ':'마감 '}<input type="date" data-tdue="${esc(t.id)}" value="${esc(due)}"></label>`
      + `<button type="button" class="del" data-tdel="${esc(t.id)}" title="과업 삭제">×</button></div>`
      + subsHTML(t) + `<textarea data-tm="${esc(t.id)}" lang="ko" placeholder="메모">${esc(t.memo||'')}</textarea></li>`; }).join('')
    || '<li class="empty">추후 과업이 없습니다. 이 통화 뒤에 할 일이 있으면 위에 적어 주세요.</li>';

$('#taskList').addEventListener('dragend', ()=>{ dragId=null; document.querySelectorAll('#taskList li.task').forEach(x=>{ x.draggable=false; x.classList.remove('dragging','drop-before','drop-after'); }); });

document.addEventListener('dragover', e=>{ if(!dragId) return; const EDGE=70, H=window.innerHeight, sp=e.clientY<EDGE ? -Math.ceil((EDGE-e.clientY)/3) : e.clientY>H-EDGE ? Math.ceil((e.clientY-(H-EDGE))/3) : 0; if(sp) window.scrollBy(0, sp); });   // 화면 끝에서 저절로 스크롤
function toItem(f=form, base=cur){
  const id = base ? base.id : (Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const open = f.tasks.filter(t=>!t.done).length, first = String(f.note||'').split(/\n/)[0].slice(0,60);
  let h={}; try{ h=JSON.parse((base&&base.history)||'{}')||{}; }catch(_){}
  return { ...(base||{}), id, saved: base ? base.saved : new Date().toISOString(), callStart: base ? base.callStart : (startedAt||new Date()).toISOString(),
    takenBy: base ? (base.takenBy || user.name || '') : (user.name || ''), owner: user.name || '', callType: CALL_TYPE,
    summary: [first, open ? `추후 과업 ${open}건` : ''].filter(Boolean).join(' · '), date: f.date, people: f.people,
    contact: f.name, phone: f.phone, note: f.note, history: JSON.stringify({...h, h:h.h||[], tasks:f.tasks}) };
}
function fromItem(r){ return { name:r.contact||'', phone:r.phone||'', date:String(r.date||'').slice(0,10), people:r.people||'', note:r.note||'', tasks:tasksOfItem(r).map(t=>({...t})) }; }
function save(){

}

  pending.push({action:'del', id:cur.id}); writeJSON(PEND_LS,pending); items=items.filter(x=>x.id!==cur.id); cur=null; form=blankForm(); saved=JSON.stringify(form); paintForm(true); renderLists(); flush(); toast('삭제했습니다.'); };

  const list=all.filter(hit);

document.addEventListener('click', e=>{

// ===================== 안내용 가격 · 사담 현황 =====================
// 가격: 견적서 사이트 품목 목록(품목 관리 값 반영). 단체 화면이 받아 둔 것을 먼저 쓰고, 없으면 직접 불러옴
const HOLI = new Set(['2026-12-25','2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-06-06','2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25']);
const isRed = d => { const t=new Date(d+'T00:00'); return !isNaN(t) && (t.getDay()===0 || t.getDay()===6 || HOLI.has(d)); };
let cat = readJSON('sayuwon_quote_cat', null);
const QUOTE_PAGE = /github\.io$/.test(location.hostname) ? 'https://hyunbin5786.github.io/sayuwon-sales/document/' : 'document/index.html';
const QUOTE_SHARED = "https://script.google.com/macros/s/AKfycbyFMeWFtokUB9FW44ZRrOMssIA_2jJzKC9dhjDR7c4WgdPxsaqzT1aLbLWmpIwvVMmY/exec";
async function loadCat(){
  try{
    const [html, shared] = await Promise.all([fetch(QUOTE_PAGE+'?t='+Date.now()).then(r=>r.text()), fetch(QUOTE_SHARED).then(r=>r.json()).catch(()=>null)]);
    const m=html.match(/var CATALOG_RAW = \[([\s\S]*?)\];/); if(!m) throw 0;
    const raw=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]); const d=(shared&&shared.data)||{};
    cat = {...(cat||{}), raw, edits:d.edits||{}, added:d.added||[], at:new Date().toISOString()};
  }catch(_){}
  paintPrices();
}
function catItems(){
  if(!cat || !cat.raw) return [];
  const out=[], seen={};
  cat.raw.forEach(line=>{ const [src,price]=line.split('|'); if(seen[src]) return; seen[src]=1; const e=(cat.edits||{})[src]||{}; if(e.hidden) return;
    out.push({src, name:String(e.name||'').trim(), price: e.price!=null ? Number(e.price) : (price?Number(price):null), kind: e.kind || (/\(관람,/.test(src)?'package':/관람/.test(src)&&!/관람권|관람식사권/.test(src)?'view':'') }); });
  (cat.added||[]).forEach(a=>{ if(!a.hidden) out.push({src:a.src||a.name, name:a.name, price:a.price!=null?Number(a.price):null, kind:a.kind||''}); });
  return out;
}
function paintPrices(){ if(!$('#priceBox')) return;   // 안내용 가격은 없앰 (2026-11-14)
  const day = form.date || ymd(new Date()), we=isRed(day), pre=we?'주말/공휴일':'평일';
  $('#priceDay').textContent = `${dLabel(day)} → ${we?'주말 · 공휴일':'평일'} 가격${form.date?'':' (방문 희망일을 넣으면 그날 기준)'}`;
  const its=catItems().filter(it=>it.price!=null && String(it.src).startsWith(pre) && !/네이버/.test(it.src) && (it.kind==='view' || it.kind==='package'));
  const label = it => { let s=String(it.src).replace(/^(평일|주말\/공휴일)\s*/,''); const p=s.match(/^\(관람,\s*(.+)\)$/); if(p) return '관람 + '+p[1]; const t=s.match(/\((\d\d):00~(\d\d):00\)/); return s.replace(/\(\d\d:00~\d\d:00\)/,'').replace(/^관람\(학생\)/,'관람 (학생)').trim()+(t?` (${+t[1]}~${+t[2]}시)`:''); };
  const per = n => { const k=Number(String(form.people).replace(/\D/g,''))||0; return k>1 ? `<td class="n">${(n*k).toLocaleString('ko-KR')}</td>` : ''; };
  const k=Number(String(form.people).replace(/\D/g,''))||0;
  $('#priceBox').innerHTML = its.length ? `<table class="pt"><thead><tr><th>상품</th><th style="text-align:right">1인</th>${k>1?`<th style="text-align:right">${k}명</th>`:''}</tr></thead><tbody>${its.map(it=>`<tr><td>${esc(label(it))}</td><td class="n">${it.price.toLocaleString('ko-KR')}</td>${per(it.price)}</tr>`).join('')}</tbody></table><p class="hint" style="margin-top:6px">품목 관리 기준 정상가 · 개인 예약 할인은 반영하지 않음</p>` : '<p class="empty">가격을 불러오지 못했습니다.</p>';
  paintSeats();
}
// 사담 · 마방 남은 자리: 관리자 사이트 현황 (단체 화면과 같은 자료, 15분마다 갱신)
function paintSeats(){ if(!$('#seatBox')) return;
  const ad=readJSON('sayuwon_intake_admin', null), day=form.date, d=ad && ad.days && day && ad.days[day];
  const NAMES={L1:'사담 런치 1부', L2:'사담 런치 2부', D:'사담 디너', MB:'마방 사유의 밥상'};

// ===================== 마감이 된 추후 과업 알림: 오전 8시 · 11시 · 오후 1시 · 5시 =====================
// 그 시각이 지나고 처음 화면을 볼 때 (시각마다 한 번, 단체 화면과 같은 기록이라 두 화면에서 두 번 뜨지 않음). 내 개인고객 과업 + 내가 영업 담당인 단체 과업
const TASK_SLOT_LS='sayuwon_task_slot', ALERT_HOURS=[8,11,13,17], QUIET_MS=30*60e3;
let groupMine=[];
function checkDue(){
  if(document.querySelector('.modal:not([hidden])')) return;
  const nowD=new Date(), today=todayYmd(), h=nowD.getHours(), slotH=ALERT_HOURS.filter(x=>h>=x).pop(); if(slotH==null) return;
  let slots=''; try{ slots=localStorage.getItem(TASK_SLOT_LS)||''; }catch(_){} const key=`${today}|${slotH}`; if(slots.split(',').includes(key)) return;
  const me=user.name||'', fresh = t => +nowD - (+new Date(t.dueSetAt||t.at||0)||0) < QUIET_MS;
  const due=[];
  shown().filter(r=>(r.owner||r.takenBy)===me).forEach(r=>tasksOfItem(r).forEach(t=>{ const d=t.due||today; if(!t.done && d<=today && !fresh(t)) due.push({r, t:{...t, due:d}, personal:true}); }));
  groupMine.forEach(r=>tasksOfItem(r).forEach(t=>{ const d=t.due||String(r.saved||'').slice(0,10)||today; if(!t.done && d<=today && !fresh(t)) due.push({r, t:{...t, due:d}}); }));
  if(!due.length) return;
  try{ localStorage.setItem(TASK_SLOT_LS, [...slots.split(',').filter(s=>s.startsWith(today)), key].join(',')); }catch(_){}
  due.sort((a,b)=>a.t.due.localeCompare(b.t.due));
  $('#dueList').innerHTML = due.map(({r,t,personal})=>{ const late=t.due<today;
    return `<li class="${late?'late':''}"><span class="who"><span class="tag">${personal?'개인':'단체'}</span> <b>${esc(personal ? (r.contact||'(이름 없음)') : (r.org||r.contact||'(업체 미정)'))}</b>${personal&&r.phone?` · ${esc(r.phone)}`:''}${!personal&&r.date?` · 방문 ${esc(dLabel(r.date))}`:''}<br><b class="t">${esc(t.title)}</b> <small class="hint" style="display:inline">마감 ${esc(dLabel(t.due))} ${late?'(지남)':'(오늘)'}</small></span>`
      + (personal ? `<button class="btn primary" data-ddone="${esc(r.id)}|${esc(t.id)}">완료</button><button class="btn" data-dopen="${esc(r.id)}">열기</button>` : `<button class="btn" data-gopen="${esc(r.id)}">열기</button>`) + `</li>`; }).join('');
  $('#dueTitle').innerHTML = `마감이 된 추후 과업 <small>${due.length}개 · 단체 + 개인 · 알림은 오전 8시 · 11시 · 오후 1시 · 5시</small>`;
  $('#dueModal').hidden=false;
}
$('#dueClose').onclick=()=>{ $('#dueModal').hidden=true; };
$('#dueList').addEventListener('click', e=>{ const d=e.target.dataset;
  if(d.dopen){ $('#dueModal').hidden=true; openItem(d.dopen); return; }
  if(d.gopen){ $('#dueModal').hidden=true; location.href='group.html?open='+encodeURIComponent(d.gopen); return; }
  if(d.ddone){ const [rid,tid]=d.ddone.split('|'), r=shown().find(x=>x.id===rid); if(!r) return; const f=fromItem(r), t=f.tasks.find(x=>x.id===tid); if(!t) return;
    t.done=true; t.doneAt=new Date().toISOString(); t.doneBy=user.name||''; (t.xsubs||[]).forEach(x=>x.done=true); const item=toItem(f, r); put(item);
    if(cur && cur.id===rid){ cur=item; form=fromItem(item); saved=JSON.stringify(form); paintForm(true); }
    e.target.closest('li').remove(); if(!$('#dueList').children.length) $('#dueModal').hidden=true; toast('과업을 완료로 표시했습니다.'); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(!$('#allModal').hidden){ $('#allModal').hidden=true; } else if(!$('#dueModal').hidden){ $('#dueModal').hidden=true; } } });
setInterval(checkDue, 60000);   // 1분마다 알림 시각인지 확인
// 마이페이지에서 개인고객 과업을 누르면 personal.html?open=통화ID → 그 통화를 엶 (목록을 받은 뒤)
let openId = new URLSearchParams(location.search).get('open');
function tryOpen(){ if(!openId) return; if(shown().some(x=>x.id===openId)){ const id=openId; openId=null; history.replaceState(null,'',location.pathname); openItem(id); } }
enhanceDates();   // 방문 희망일 / 예약일 · 과업 마감일: 누르면 달력 · 칸 안에 (요일)
paintForm(); renderLists(); paintSync(); tryOpen(); flush();

<!-- 마이페이지 팝업 (메뉴 6번 페이지 group.html?my=1 을 그대로 띄움, 품목관리 팝업과 같은 크기) -->
<style>
.mypop{position:fixed;inset:0;z-index:60;background:rgba(30,30,25,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.mypop[hidden]{display:none}
.mypop .box{width:min(1200px,100%);height:calc(100vh - 48px);background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mypop iframe{width:100%;height:100%;border:0;display:block}
</style>
<div class="mypop" id="myPop" hidden><div class="box"><iframe id="myPopFrame" title="마이페이지"></iframe></div></div>
<script>
(function(){
  const pop=document.getElementById('myPop'), fr=document.getElementById('myPopFrame');
  window.openMyPop = () => { fr.src='group.html?my=1&embed=1&t='+Date.now(); pop.hidden=false; };
  const close = () => { pop.hidden=true; fr.src='about:blank'; };
  window.addEventListener('message', e=>{ if(!e.data || e.data.type!=='sy-my' || e.source!==fr.contentWindow) return;
    if(e.data.ev==='close') close();
    if(e.data.ev==='go' && /^(group|personal)\.html\?open=/.test(e.data.url||'')){ close(); location.href=e.data.url; } });   // 과업 줄 → 그 화면으로
  pop.addEventListener('click', e=>{ if(e.target===pop) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !pop.hidden){ e.preventDefault(); close(); } });
  document.addEventListener('click', e=>{ const b=e.target.closest('[data-mypop]'); if(b){ e.preventDefault(); window.openMyPop(); } });
})();
</script>
</body>
</html>
